function resistShadow(){
  if(G.shadowResistUsed) return;
  G.shadowResistUsed = true;
  G.resolve = 0;
  /* 同上：终局页写明「3 点生命」，就不该被破阵减免成 2 点。
     代价按字面扣，撑不住就倒在这里 —— 文案里已经说清了。 */
  G.hp -= 3;
  addShadow(-3);
  clamp();
  addLog('你把名字又说了一遍。');
  pushEcho({ t:'resist', once:true });
  if(G.hp <= 0){ G.screen = 'map'; return endRun('dead'); }
  G.screen = 'map';
  render();
}

function render(){
  if(!G || G.screen === 'title') return renderTitle();
  /* 阴影到顶不再拖到结算才改判：立刻给一次终局抉择。
     检定动画中途不打断，等它回到地图再拦；抗争之后若阴影已退，退回地图。 */
  if(!G.over && G.shadow >= SHADOW_MAX && G.screen !== 'shadowend' && G.screen !== 'check'){
    G.screen = 'shadowend';
  }
  if(G.screen === 'shadowend' && G.shadow < SHADOW_MAX) G.screen = 'map';
  /* 每次状态变化立刻落盘：手机切后台、误刷新、被系统回收都不至于丢进度。
     结算之后不再写盘（endRun 已经 clearRun），避免已结束的一局又被存回来。 */
  if(!G.over && (G.screen === 'map' || G.screen === 'event' || G.screen === 'check' || G.screen === 'shadowend' || G.screen === 'result')){
    saveRun();
  }
  if(G.screen === 'shadowend') return renderShadowEnd();
  if(G.screen === 'camp') return renderCamp();
  if(G.screen === 'talents') return renderTalents();
  if(G.screen === 'armory') return renderArmory();
  if(G.screen === 'map') return renderMap();
  if(G.screen === 'event') return renderEvent();
  if(G.screen === 'check') return renderCheck();
  if(G.screen === 'result') return renderResult();
  return renderTitle();
}

/* 按品质抽一件装备：普通常见，传世稀有。消耗品不参与 */
function rollLootItem(rnd){
  const pool = Object.keys(ITEMS).filter(k => ITEMS[k].slot !== 'consume');
  const w = { 0:5, 1:3, 2:1.5, 3:0.6 };
  const total = pool.reduce((s,k) => s + (w[ITEMS[k].q] || 1), 0);
  let r = rnd() * total;
  for(const k of pool){
    r -= (w[ITEMS[k].q] || 1);
    if(r <= 0) return k;
  }
  return pool[pool.length - 1];
}

/* ---------- 随身战利品 ----------
   捡到的东西局内立即生效，但能不能带回营地原本只看结局。
   「收好」是玩家自己能做的保底：花 1 点决心，把一件裹进行囊最底层。
   代价、次数、按钮可用态、提示都从 secureCost() 一处取，界面不许另写一份。 */
const SEC_LIMIT = 2;
function secureCost(){
  const left = G && Number.isFinite(G.secLeft) ? G.secLeft : SEC_LIMIT;
  const place = !!(G && !G.over && (G.screen === 'map' || G.screen === 'event'));
  const ok = place && left > 0 && G.resolve >= 1;
  let note;
  if(left <= 0) note = '这一趟已经收好过两件。行囊就这么大。';
  else if(!place) note = '回到路上再收。';
  else if(!ok) note = '现在腾不出手来。';
  else note = '收好 1 件花 1 点决心 · 还剩 ' + left + ' 次';
  return { ok, left, note };
}
function secureLoot(i){
  const l = G && G.loot && G.loot[i];
  const c = secureCost();
  if(!l || l.sec || !c.ok) return;
  const it = ITEMS[l.id];
  G.resolve -= 1;
  G.secLeft = c.left - 1;
  l.sec = true;
  addLog('收好 · ' + (it ? it.name : l.id));
  pushEcho({ t:'secure', name: it ? it.name : l.id, once:true });
  render();
}
function lootBar(){
  if(!G || !G.loot || !G.loot.length) return '';
  const c = secureCost();
  const canBtn = (G.screen === 'map' || G.screen === 'event') && !G.over;
  const chips = G.loot.map((l,i)=>{
    const it = ITEMS[l.id];
    const nm = it ? it.name + (l.plus ? ' +' + l.plus : '') : l.id;
    const tail = l.sec ? '<i>已收好</i>'
      : (canBtn ? `<button class="secbtn" onclick="secureLoot(${i})" ${c.ok?'':'disabled'}>收好</button>` : '');
    return `<span class="lchip ${l.sec?'sec':''}">${esc(nm)}${tail}</span>`;
  }).join('');
  return `<div class="lootbar">
    <span class="lname">随身</span>
    <span class="litems">${chips}</span>
    <span class="lrisk">${esc(c.note)} · 收好的东西倒下也在，堕入阴影时什么都带不走</span>
  </div>`;
}

/* 这一趟还带着一件事：常驻在局内每一屏，玩家不用去记它走到哪一步了 */
function threadBar(){
  if(!G || !G.thread || G.over) return '';
  const def = threadDef();
  if(!def) return '';
  const th = G.thread;
  const st = th.done ? '办成了' : th.dropped ? '放下了' : (th.pushes + 1) + ' / ' + THREAD_STEPS.length;
  const note = th.done ? '后面没有别的事了。'
    : th.dropped ? '你把它留在了路上。'
    : '下一次它找上来，是在第 ' + (THREAD_STEPS[th.step] + 1) + ' 程。';
  return `<div class="threadbar">
    <span class="tk">这一趟还带着一件事</span>
    <span class="tn">${esc(def.name)}</span>
    <span class="ts">${esc(st)}</span>
    <span class="td">${esc(note)}</span>
  </div>`;
}

/* ---------- 存档导出 / 导入（只涉及局外进度，不动当前这一局） ---------- */
function ioMsg(t, bad){
  const el = document.getElementById('ioMsg');
  if(!el) return;
  el.textContent = t;
  el.className = 'iomsg' + (bad ? ' bad' : '');
}

function exportSave(){
  const payload = { v:2, game:'middle-earth-expedition', meta: META };
  const txt = JSON.stringify(payload);
  const ta = document.getElementById('saveIO');
  if(!ta) return;
  ta.value = txt;
  ta.classList.remove('hidden');
  try{ ta.focus(); ta.select(); }catch(e){}
  let copied = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt);
      copied = true;
    }
  }catch(e){}
  ioMsg(copied
    ? '已复制到剪贴板（' + txt.length + ' 字符）。粘到备忘录或发给自己。'
    : '已生成（' + txt.length + ' 字符）。长按上面文本框，全选复制。');
}

function toggleImport(){
  const row = document.getElementById('importRow');
  if(!row) return;
  row.classList.toggle('hidden');
  ioMsg('');
}

function doImport(){
  const el = document.getElementById('importIn');
  const raw = el ? el.value.trim() : '';
  if(!raw){ ioMsg('先粘一段存档码。', true); return; }

  let obj;
  try{ obj = JSON.parse(raw); }
  catch(e){ ioMsg('这段码读不出来，可能复制时少了字符。', true); return; }

  const m = (obj && obj.meta) ? obj.meta : obj;
  if(!m || typeof m !== 'object'){ ioMsg('格式不对。', true); return; }

  /* 白名单清洗：只取认识的字段并夹到合法区间，脏数据不会把存档写坏 */
  const c = defaultMeta();
  const num = (v, lo, hi, def) => {
    const n = Number(v);
    if(!isFinite(n)) return def;
    return Math.max(lo, Math.min(hi, Math.floor(n)));
  };
  c.renown = num(m.renown, 0, 9999999, 0);
  c.materials = num(m.materials, 0, 9999999, 0);
  c.maxTier = num(m.maxTier, 1, 6, 1);
  c.runs = num(m.runs, 0, 999999, 0);
  c.wins = num(m.wins, 0, 999999, 0);
  c.best = num(m.best, 0, 9999999, 0);

  c.talents = Array.isArray(m.talents)
    ? m.talents.filter(id => TALENTS.some(t => t.id === id))
    : [];

  c.armory = {};
  if(m.armory && typeof m.armory === 'object'){
    for(const k in m.armory){
      if(!ITEMS[k]) continue;
      c.armory[k] = num(m.armory[k], 0, 5, 0);
    }
  }

  c.loadout = {};
  if(m.loadout && typeof m.loadout === 'object'){
    for(const k in m.loadout){
      if(SLOT_ORDER.indexOf(k) < 0) continue;
      if(!ITEMS[m.loadout[k]]) continue;
      c.loadout[k] = m.loadout[k];
    }
  }

  c.seen = {};
  if(m.seen && typeof m.seen === 'object'){
    Object.keys(m.seen).slice(0, 800).forEach(k => { c.seen[k] = 1; });
  }

  const okOrigins = Array.isArray(m.origins)
    ? m.origins.filter(id => HEROES.some(h => h.id === id))
    : [];
  c.origins = okOrigins.length ? okOrigins : ['ranger','warden','lore'];
  c.lastHero = (m.lastHero && HEROES.some(h => h.id === m.lastHero)) ? m.lastHero : '';

  META = c;
  checkUnlocks();
  saveMeta(META);
  render();
  ioMsg('读入完成：声望 ' + c.renown + '、材料 ' + c.materials
    + '、天赋 ' + c.talents.length + ' 个、藏品 ' + Object.keys(c.armory).length + ' 件。');
}

function openTalents(){ G = G || null; renderTalents(); }
function openArmory(){ renderArmory(); }

/* ---------- 天赋树 ---------- */
function renderTalents(){
  const m = META;
  const rows = [0,1,2];
  const body = TALENT_BRANCHES.map(br=>{
    const list = TALENTS.filter(t=>t.b===br.id);
    const rowsHtml = rows.map(r=>{
      const items = list.filter(t=>t.row===r);
      return `<div class="trow ${items.length===2?'two':''}">${items.map(t=>{
        const owned = m.talents.includes(t.id);
        const can = !owned && t.req.every(x=>m.talents.includes(x)) && m.renown >= t.cost;
        const cls = owned ? 'on' : (can ? '' : 'locked');
        return `<button class="tnode ${cls}" data-t="${t.id}">
          <div class="tn">${t.name}</div>
          <div class="td">${t.desc}</div>
          <div class="tc">${owned ? '已点亮' : t.cost + ' 声望'}</div>
        </button>`;
      }).join('')}</div>`;
    }).join('');
    return `<div class="talentbranch"><h3>${br.name}</h3><div class="bsub">${br.sub}</div>${rowsHtml}</div>`;
  }).join('');

  app.innerHTML = `
  <div class="topbar">
    <div class="brand" onclick="openCampBack()">天赋<small>TALENTS</small></div>
    <div class="metabar"><span>声望 <b>${m.renown}</b></span></div>
  </div>
  ${body}
  <div class="btnrow"><button class="btn ghost" onclick="openCampBack()">返回营地</button></div>`;

  document.querySelectorAll('.tnode').forEach(b=>{
    b.onclick = ()=>{
      const t = TALENTS.find(x=>x.id===b.dataset.t);
      if(!t || m.talents.includes(t.id)) return;
      if(!t.req.every(x=>m.talents.includes(x)) || m.renown < t.cost) return;
      m.renown -= t.cost;
      m.talents.push(t.id);
      saveMeta(m); META = m;
      renderTalents();
    };
  });
}

function openCampBack(){ G = null; renderCamp(); }

/* ---------- 军械库 ---------- */
/* 锻造是局外行为，这一页 G 为 null，所以按「上一次是谁出的门」判定矮人半价。
   按钮的可用状态和实际扣费必须用同一个函数，否则会出现「按钮灰着但点得动」。 */
function forgeIsHalf(){
  const hero = HEROES.find(h => h.id === META.lastHero);
  return !!(hero && hero.rule === 'forgeHalf');
}
function forgeCost(plus){
  const base = plus + 1;
  return forgeIsHalf() ? Math.ceil(base / 2) : base;
}

function renderArmory(){
  const m = META;
  m.loadout = m.loadout || {};
  const owned = Object.keys(m.armory).sort((a,b)=>{
    const ia = ITEMS[a], ib = ITEMS[b];
    const sa = ia ? SLOT_ORDER.indexOf(ia.slot) : 99;
    const sb = ib ? SLOT_ORDER.indexOf(ib.slot) : 99;
    if(sa !== sb) return sa - sb;
    return (ib ? ib.q : 0) - (ia ? ia.q : 0);
  });

  const slotRows = SLOT_ORDER.map(s=>{
    const id = m.loadout[s];
    const it = id ? ITEMS[id] : null;
    const plus = it ? (m.armory[id]||0) : 0;
    return `<div class="slotrow">
      <div class="slotname">${SLOTS[s]}</div>
      <div class="slotval ${it?'':'empty'}">${it ? esc(it.name) + (plus?' +'+plus:'') : '空'}</div>
    </div>`;
  }).join('');

  const list = owned.length ? owned.map(id=>{
    const it = ITEMS[id];
    if(!it) return '';
    const plus = m.armory[id] || 0;
    const equipped = Object.values(m.loadout).includes(id);
    const cost = forgeCost(plus);
    const fxTxt = Object.keys(it.fx).map(k=>{
      const label = ATTRS[k] ? ATTRS[k] : ({hpMax:'生命上限',supplyMax:'补给上限',resolveMax:'决心上限',hp:'生命'}[k] || k);
      return label + ' +' + it.fx[k];
    }).join(' · ');
    return `<div class="itemcard ${equipped?'on':''}">
      <div class="iname"><span>${esc(it.name)}</span><span class="iplus">${plus?'+'+plus:''}</span></div>
      <div class="ifx">${SLOTS[it.slot]} · ${QUALITY[it.q]} · ${fxTxt}</div>
      <div class="btnrow" style="margin-top:8px;gap:6px">
        <button class="btn sm" data-eq="${id}">${equipped?'卸下':'装配'}</button>
        <button class="btn sm ghost" data-forge="${id}" ${plus>=5||m.materials<cost?'disabled':''}>锻造 +${plus+1}（${cost} 材料）</button>
      </div>
    </div>`;
  }).join('') : `<p class="note">军械库是空的。把局内捡到的东西「收好」并带回，它们才会出现在这里。</p>`;

  app.innerHTML = `
  <div class="topbar">
    <div class="brand" onclick="openCampBack()">军械库<small>ARMORY</small></div>
    <div class="metabar"><span>材料 <b>${m.materials}</b></span></div>
  </div>

  <div class="card pad">
    <h2 style="font-size:16px">当前装配</h2>
    <div style="margin-top:8px">${slotRows}</div>
    <p class="note">强化每级给主属性 +1；到达 +5 封顶。锻造失败不会掉级。</p>
    ${forgeIsHalf() ? '<p class="note" style="color:var(--gold)">上一次出门的是矮人。炉火的手艺还在：锻造费用减半。</p>' : ''}
  </div>

  <div class="card pad" style="margin-top:14px">
    <h2 style="font-size:16px">藏品</h2>
    <div class="itemlist">${list}</div>
  </div>

  <div class="btnrow"><button class="btn ghost" onclick="openCampBack()">返回营地</button></div>`;

  document.querySelectorAll('[data-eq]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.eq, it = ITEMS[id];
      if(!it) return;
      m.loadout = m.loadout || {};
      if(m.loadout[it.slot] === id) delete m.loadout[it.slot];
      else m.loadout[it.slot] = id;
      saveMeta(m); META = m;
      renderArmory();
    };
  });
  document.querySelectorAll('[data-forge]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.forge;
      const plus = m.armory[id] || 0;
      const cost = forgeCost(plus);
      if(plus>=5 || m.materials<cost) return;
      m.materials -= cost;
      m.armory[id] = plus + 1;
      saveMeta(m); META = m;
      renderArmory();
    };
  });
}

/* ---------- 地图 ---------- */
function renderMap(){
  const map = G.map;
  const cur = map.index[G.at] || map.layers[0][0];
  const avail = new Set(cur.next);
  const walked = new Set(G.walkedList || []);
  const visited = new Set([map.layers[0][0].id]);
  (G.walkedList||[]).forEach(e=>{ const p=e.split('>'); if(p[1]) visited.add(p[1]); });

  let edges = '', nodes = '';
  for(const a of Object.values(map.index)){
    for(const nb of a.next){
      const b = map.index[nb];
      const isWalked = walked.has(a.id+'>'+nb);
      const isChoice = a.id === G.at && avail.has(nb);
      const col = isWalked ? '#96682c' : (isChoice ? '#a87c38' : '#cdbc9d');
      const w = isWalked ? 1.7 : (isChoice ? 1.3 : 0.8);
      const op = isWalked ? .9 : (isChoice ? .8 : .34);
      edges += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}" stroke-width="${w}" stroke-dasharray="${isWalked?'0':'3 4'}" opacity="${op}"/>`;
    }
  }

  /* 远见：把可去节点的下一层也标亮，让玩家看见再下一程的节点类型 */
  const peekIds = new Set();
  if(G.rules && G.rules.seeNext){
    for(const id of cur.next){
      const n = map.index[id];
      if(n) for(const nb of n.next) peekIds.add(nb);
    }
  }
  const peekHtml = peekIds.size
    ? `<div class="nextpeek"><span class="npk">远见 · 再下一程（虚线圈，不可点）</span>${Array.from(new Set(
        Array.from(peekIds).map(id => {
          const t = NODE_TYPES[map.index[id].type];
          return t.label + ' · ' + t.name;
        })
      )).join('　')}</div>`
    : '';

  /* 路标：把这一程每条路的确定代价摊开写，选择发生在信息充分之后。
     只有真有得选时才显示，只剩一条路时不啰嗦。 */
  const routeHtml = avail.size >= 2 ? (()=>{
    const rows = Array.from(avail).map(id=>{
      const n = map.index[id], t = NODE_TYPES[n.type], pc = PATH_COST[n.type] || {};
      const tag = pc.shadow ? '阴影 +' + pc.shadow : (pc.renown ? '声望 +' + pc.renown : '无额外代价');
      const cls = pc.shadow ? 'rt' : (pc.renown ? 'rt good' : 'rh');
      return `<div class="ritem"><span class="rn">${t.label} · ${t.name}</span>`+
             `<span class="rh">${esc(pc.hint || '')}</span><span class="${cls}">${tag}</span></div>`;
    }).join('');
    return `<div class="routebox"><div class="rk">这一程的 ${avail.size} 条路</div>${rows}</div>`;
  })() : '';

  /* 稳住：阴影不是单向闸门，玩家能主动花资源把它压回去 */
  const steadyInfo = steadyCost();
  const steadyHtml = (G.shadow >= 2) ? `<div class="steadybox">
      <span class="sn">${esc(shadowStage().name)} · ${esc(steadyInfo.note)}</span>
      <button class="btn ghost sm" id="steadyBtn" ${steadyInfo.ok ? '' : 'disabled'}>记起自己的名字 · 阴影 −2（${esc(steadyInfo.label)}）</button>
    </div>` : '';

  for(const n of Object.values(map.index)){
    const t = NODE_TYPES[n.type];
    const isAvail = avail.has(n.id), isCur = n.id === G.at, isPast = visited.has(n.id) && !isCur;
    const dim = !isAvail && !isCur && !isPast && !peekIds.has(n.id);
    const isPeek = peekIds.has(n.id) && !isAvail && !isCur && !isPast;
    nodes += `<g class="node-g ${isAvail?'avail':''} ${dim?'locked':''}" data-node="${n.id}">
      ${isAvail ? `<circle cx="${n.x}" cy="${n.y}" r="21" fill="none" stroke="#b8873f" stroke-width="0.9" opacity=".55"/>` : ''}
      ${isPeek ? `<circle cx="${n.x}" cy="${n.y}" r="21" fill="none" stroke="#b8873f" stroke-width="0.9" stroke-dasharray="2 4" opacity=".5"/>` : ''}
      <circle class="ring" cx="${n.x}" cy="${n.y}" r="15" fill="${t.fill}" stroke="${isCur?'#96682c':t.color}" stroke-width="${isCur?2.4:(isAvail?1.7:1)}" opacity="${dim?.5:1}"/>
      <text x="${n.x}" y="${n.y+1}" text-anchor="middle" dominant-baseline="central" style="font:500 12px var(--serif);fill:${t.color};opacity:${dim?.62:1}">${t.label}</text>
      <circle cx="${n.x}" cy="${n.y}" r="26" fill="transparent"/>
    </g>`;
  }

  /* 分区虚线 */
  let dividers = '';
  for(let i=LAYERS_PER_REGION;i<TOTAL_LAYERS;i+=LAYERS_PER_REGION){
    const y = 60 + i*48 - 22;
    dividers += `<line x1="70" y1="${y}" x2="650" y2="${y}" stroke="#dcccac" stroke-width="0.6" stroke-dasharray="2 6"/>`;
  }

  const h = 60 + (TOTAL_LAYERS-1)*48 + 40;
  const curRegion = layerRegion(G.layer);
  const ri2 = ROUTE.indexOf(curRegion);

  app.innerHTML = topbar() + statbar() + `
    <div class="card mapwrap">
      <div class="stepper">
        ${ROUTE.map((r,i)=>`
          ${i?'<span class="step-line"></span>':''}
          <span class="step ${i===ri2?'on':(i<ri2?'done':'')}"><i class="dot2"></i><span class="full">${REGIONS[r].name}</span><span class="abbr">${REGIONS[r].short}</span></span>
        `).join('')}
      </div>
      <div style="padding:8px 22px 2px">
        <h2 style="font-size:16px">${cur.type==='final' ? '最后一程' : (G.layer===0 ? '从这里开始' : '选下一处落脚点')}</h2>
      </div>
      <div class="mapscroll">
        <svg viewBox="0 0 720 ${h}" role="img">
          ${dividers}${edges}${nodes}
        </svg>
      </div>
      <div class="maplegend">
        <span><i class="dot" style="background:#f7e4de;border-color:#8a3a2a"></i>险 · 遭遇</span>
        <span><i class="dot" style="background:#e4ecf4;border-color:#3d5a7a"></i>闻 · 叙事</span>
        <span><i class="dot" style="background:#e6eedd;border-color:#4d6b3a"></i>营 · 休整</span>
        <span><i class="dot" style="background:#f6ecd6;border-color:#96682c"></i>藏 · 秘藏</span>
      </div>
      ${peekHtml}${routeHtml}${steadyHtml}
    </div>

    <div class="btnrow mapfoot" style="justify-content:space-between">
      <span class="note" style="margin:0">${avail.size ? '点击带金环的节点继续。' : ''}${G.loot.length ? ' · 随身战利品 ' + G.loot.length + ' 件' : ''}</span>
      ${G.noRetreat ? '<span class="warn" style="margin:0">本档难度无法撤退。</span>' : '<button class="btn ghost sm" id="retreatBtn">就此撤退</button>'}
    </div>

    ${G.log.length ? `<div class="logbox"><div class="k">行程记录</div><ul class="loglist">${G.log.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>` : ''}
  `;

  document.querySelectorAll('.node-g.avail').forEach(g=>{
    g.onclick = ()=> enterNode(g.dataset.node);
  });
  const rb = $('retreatBtn');
  if(rb) rb.onclick = ()=> endRun('retreat');
  const sb = $('steadyBtn');
  if(sb) sb.onclick = doSteady;
  const sc = document.querySelector('.mapscroll');
  if(sc && sc.scrollWidth > sc.clientWidth + 4){
    const mid = (sc.scrollWidth - sc.clientWidth)/2;
    sc.scrollLeft = mid;
    setTimeout(()=>{ sc.scrollLeft = mid; }, 0);
  }
  saveRun();
}

/* ---------- 进入节点 ---------- */
function enterNode(id){
  const node = G.map.index[id];
  if(!G.map.index[G.at].next.includes(id)) return;
  G.perLayerLore = false;
  G.riderUsed = false;

  if(node.layer > 0){
    /* 熟路：认得路，就少走冤枉路（行路消耗 −1，但不倒给补给）。
       路耗 +1 只作用于荒野段：全程 +1 会让补给上限 5 的局必然饿死，
       玩家从第 4 程起就只能看着血一格一格掉，没有可做的事。 */
    const drain = (G.supplyDrain && layerRegion(node.layer) === 'wild') ? G.supplyDrain : 0;
    G.supply -= Math.max(0, 1 + drain - ((G.rules && G.rules.roadSave) || 0));
    /* 越往东，侵蚀越重。
       不再有「到 7 之后每层再 +1」：那是自动滑坡，玩家一进这个区间就必到 8，
       中间没有任何能做的事。到顶改由专属终局页给一次抉择。 */
    if(layerRegion(node.layer) === 'wild') addShadow(1);
    if(G.supply <= 0){ hurt(2); addLog('补给耗尽，身体开始垮。'); pushEcho({ t:'hurt', once:true, cause:'supply' }); }
  }
  clamp();

  /* 阴影紧随（难度 IV 起）：追踪只在荒野段咬人。
     从第一程就每层扣血会让第四档直接断崖，前三档攒的补给与血量
     在荒野之前就被磨光，玩家没有可应对的窗口。 */
  if(G.hunt && node.layer > 0 && layerRegion(node.layer) === 'wild'){
    const rnd = mulberry32(hashStr(G.seed+'|hunt|'+id));
    if(rollD20(rnd) + G.attrs.spirit < effDC(13)){
      hurt(2);
      addLog('追踪者跟上来了一点。');
      pushEcho({ t:'hurt', once:true, cause:'hunt' });
    }
  }
  if(G.hp <= 0) return endRun('dead');

  G.walkedList.push(G.at + '>' + id);
  const prevRegion = layerRegion(G.layer);
  G.layer = node.layer;
  G.at = id;

  /* 兑现地图路标写明的代价。只有险与藏留下痕迹，营地与见闻不额外收费 */
  const pc = PATH_COST[node.type] || {};
  if(pc.renown){ G.renown += pc.renown; addLog('险路 · 声望 +' + pc.renown); }
  if(pc.shadow){ addShadow(pc.shadow); addLog('秘藏 · 阴影 +' + pc.shadow); }

  const newRegion = layerRegion(G.layer);
  if(newRegion !== prevRegion){
    addLog('进入 ' + REGIONS[newRegion].name);
    pushEcho({ t:'region', from:REGIONS[prevRegion].short, to:REGIONS[newRegion].short });
    if(newRegion === 'wild'){ addShadow(2); addLog('这里的空气不一样。'); }
  }

  if(node.type === 'final'){
    const opts = G.finalDC
      ? [{ label:'走出荒野', final:true, check:{ attr:'spirit', dc:G.finalDC },
           ok:{ text:'你走了出去。', fx:{} },
           no:{ text:'最后一程几乎要了你的命。', fx:{ hp:-6 } } }]
      : [{ label:'结束这次远征', final:true }];
    G.screen = 'event';
    G.event = { id:'__final', kicker:'抵达', title:'抵达', text:finalText(), options:opts };
    G.pending = null; render(); return;
  }
  if(node.type === 'treasure'){
    G.materials += (G.rules && G.rules.extraLoot ? 2 : 1);
    /* 秘藏本来就该翻出东西：按品质抽一件装备，用 seed 派生，可复现。
       辨物（extra.treasure）点亮后必定产出。 */
    const lrnd = mulberry32(hashStr(G.seed + '|loot|' + node.id));
    /* 空着手进秘藏必然翻出一件：整局颗粒无收对军械库太不友好。
       之后几次仍按品质权重抽，秘藏本来就该有东西。 */
    const guaranteed = !!(G.rules && G.rules.treasure) || G.loot.length === 0;
    if((guaranteed || lrnd() < 0.72) && G.loot.length < 6){
      const lid = rollLootItem(lrnd);
      if(lid && ITEMS[lid]){
        G.loot.push({ id: lid, plus: 0 });
        addLog('秘藏：' + ITEMS[lid].name);
      }
    }
  }
  if(node.type === 'start'){
    G.screen = 'event';
    G.event = { id:'__start', kicker:'启程', title:'启程', text:startText(), options:[{ label:'出发', free:true }] };
    G.pending = null; render(); return;
  }

  const ev = threadEvent(node) || companionEvent(node) || pickEvent(node);
  if(!ev){
    G.screen = 'event';
    G.event = { id:'__empty', kicker:'途中', title:'一路无事', text:'这一段路走得平静。没有遇到什么，也没有失去什么。',
      options:[{ label:'继续', free:true }] };
    G.pending = null; render(); return;
  }
  G.seen[ev.id] = true;
  G.eventCount = (G.eventCount || 0) + 1;
  if(ev.group){
    G.groupCount = G.groupCount || {};
    G.groupCount[ev.group] = (G.groupCount[ev.group] || 0) + 1;
  }
  /* 地区版 → 暗选项 → 夺走温和选项 → 观察选项 → 阴影改写。
     全程走副本，EVENTS 里的原始事件一次也不改。 */
  let view = regionVariant(ev, node.region);
  view = injectShadowOptions(view);
  view = noteTaken(takeGentleOptions(view));
  view = injectObserveOption(view);
  view = injectCompanionOption(view);
  G.screen = 'event';
  G.event = shadowVariant(view);
  G.pending = null;
  render();
}

/* ---------- 事件 ---------- */
function kickerFor(ev){
  const m = { encounter:'遭遇', story:'见闻', camp:'休整', treasure:'所得' };
  return m[ev.type] || '途中';
}

function dcHint(chk){
  if(!chk) return '';
  const dc = effDC(chk.dc);
  let base = G.attrs[chk.attr];
  /* 这里只预测加成，不消费：真正消费发生在 chooseOption 进入检定时 */
  if(G.hero.rule === 'rider' && chk.attr === 'valor' && !G.riderUsed) base += 2;
  if(G.rules && G.rules.firstBonus && G.firstCheck) base += 2;
  const p = Math.max(5, Math.min(95, Math.round((21 - (dc - base)) / 20 * 100)));
  if(G.rules && G.rules.dcPreview) return `DC ${dc} · ${ATTRS[chk.attr]} · 约 ${p}%`;
  return `DC ${dc} · ${ATTRS[chk.attr]}`;
}

function renderEvent(){
  const ev = G.event;
  const hasCheck = ev.options.some(o=>o.check && !o.taken);
  const opts = ev.options.map((o,i)=>{
    const taken = !!o.taken;
    const locked = !!(o.need && !hasNeed(o.need));
    let hint;
    if(taken) hint = '想不起来了';
    else if(locked) hint = needLabel(o.need);
    else if(o.need && hasNeed(o.need)) hint = needHave(o.need);
    else if(o.auto) hint = '直接可行';
    else if(o.shadowOpt) hint = '不必检定';
    else if(ev.group === 'solitude') hint = '不掷骰';
    else hint = dcHint(o.check);
    const cls = ['opt'];
    if(o.shadowOpt) cls.push('shadow-opt');
    if(locked) cls.push('locked-opt');
    if(o.auto) cls.push('auto-opt');
    if(taken) cls.push('taken-opt');
    const mark = taken ? '×' : (o.shadowOpt ? '※' : (o.auto ? '·' : (i+1)));
    return `<button class="${cls.join(' ')}" data-i="${i}" ${(locked||taken)?'disabled':''}>
      <span class="idx">${mark}</span>
      <span class="lbl">${o.label}</span>
      <span class="dc">${hint}</span>
    </button>`;
  }).join('');

  const fxHtml = (ev.fxOut && ev.fxOut.length)
    ? `<div class="fxlist">${ev.fxOut.map(f=>{
        const num = typeof f.v === 'number';
        const cls = num ? (f.v < 0 ? 'bad' : 'good') : 'good';
        const val = num ? ' ' + (f.v > 0 ? '+' : '') + f.v : ' · ' + f.v;
        return `<span class="fx ${cls}">${f.k}${val}</span>`;
      }).join('')}</div>` : '';

  app.innerHTML = topbar() + statbar() + `
    <div class="card event">
      <div class="kicker">${ev.kicker || kickerFor(ev)}</div>
      <h2>${esc(ev.title)}</h2>
      <div class="prose">${String(ev.text).split('\n').filter(x=>x.trim()).map(p=>`<p>${esc(p)}</p>`).join('')}</div>
      ${(G.tokens||[]).length ? `<div class="tokenbar">带着 · ${G.tokens.map(t=>esc(t.name)).join(' · ')}</div>` : ''}
      ${fxHtml}
      ${ev.costInfo ? `<div class="costbox"><div class="ck">代价</div><div class="ct">${esc(ev.costInfo.text)}</div></div>` : ''}
      <div class="opts">${opts}</div>
      ${ev.takenLine ? `<p class="taken-note">${esc(ev.takenLine)}</p>` : ''}
      ${hasCheck && G.resolve > 0 ? `<p class="note">你还有 ${G.resolve} 点决心。检定失败时可以花 1 点重掷。</p>` : ''}
    </div>`;

  document.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=> chooseOption(ev.options[+b.dataset.i]);
  });
}

function chooseOption(o){
  if(o.taken || (o.need && !hasNeed(o.need))) return;
  if(o.check){
    /* 一次性加成在进入检定时定死并存进 pending，重掷不会丢，也不会重复拿 */
    let bonus = 0;
    if(G.hero.rule === 'rider' && o.check.attr === 'valor' && !G.riderUsed){
      G.riderUsed = true; bonus = 2;
    }
    if(G.rules && G.rules.firstBonus && G.firstCheck){
      bonus += 2; G.firstCheck = false;
    }
    G.pending = { opt:o, checkBonus:bonus };
    G.screen = 'check'; render(); return;
  }
  if(o.final) return endRun(G.hp > 0 ? 'win' : 'dead');
  if(o.free){ addLog(G.event.title); G.screen = 'map'; render(); return; }

  if(o.vow){
    G.vow = { type:o.vow, at:G.layer };
    addLog('你立了誓。');
    pushEcho({ t:'vow' });
  }
  /* 缘由：私事只在这里推进或放下。它不进检定，所以重掷不会把同一件事记两次；
     判定用 event.threadStep 对上当前 step，结果页不会误触发。 */
  if(o.thread && G.thread && G.event && G.event.threadStep === G.thread.step
     && !G.thread.done && !G.thread.dropped){
    if(o.thread === 'push'){
      if(!G.thread.firstLayer) G.thread.firstLayer = G.layer + 1;
      G.thread.step++;
      G.thread.pushes++;
      addLog('缘由 · ' + (G.event.title || '那一件事'));
      pushEcho({ t:'thread', key:G.thread.id, step:G.thread.step,
                 label:o.label, title:G.event.title });
      if(G.thread.step >= THREAD_STEPS.length){
        G.thread.done = true;
        addLog('这件事办成了。');
      }
    } else {
      G.thread.dropped = true;
      addLog('你把那件事放下了。');
      pushEcho({ t:'thread', key:G.thread.id, step:-1,
                 label:o.label, title:G.event.title });
    }
  }
  /* 同行者：相遇时的带不带上，以及之后每一次「让他来」。
     信任用一次少一格，用完他就走；走了不能再叫回来。 */
  if(o.companion === 'join' || o.companion === 'pass'){
    const cdef = COMPANIONS.find(c => c.id === ((G.event && G.event.companionId) || ''));
    G.companionMet = true;
    if(cdef){
      if(o.companion === 'join'){
        G.companion = { id:cdef.id, trust:2, used:0, firstLayer:G.layer + 1 };
        addLog('同行 · ' + cdef.name);
        pushEcho({ t:'companion', kind:'join', name:cdef.name });
      } else {
        addLog('同行 · 各走各的');
        pushEcho({ t:'companion', kind:'pass', name:cdef.name });
      }
    }
  }
  if(o.companionOpt && G.companion && G.companion.trust > 0){
    const cdef = companionDef();
    G.companion.trust--;
    G.companion.used++;
    addLog('同行 · ' + (cdef ? cdef.name : '他') + '搭了一手');
    pushEcho({ t:'companion', kind:'use', name:cdef ? cdef.name : '' });
    if(G.companion.trust <= 0 && cdef){
      G.companionLeft = { id:cdef.id, name:cdef.name, layer:G.layer + 1 };
      addLog(cdef.name + '走了。');
      pushEcho({ t:'companion', kind:'left', name:cdef.name });
      G.companion = null;
    }
  }
  if(o.consume === 'token' && o.need && o.need.token){
    const tk = TOKENS[o.need.token];
    pushEcho({ t:'token', kind:'used', key:o.need.token, name:tk ? tk.name : o.need.token });
    G.tokens = (G.tokens||[]).filter(t=>t.id !== o.need.token);
  }
  const changes = applyFx(o.fx, { camp: G.event.type === 'camp' });
  if(o.fx && o.fx.flag && o.fx.flag.letter_home) pushEcho({ t:'letter' });
  if(o.chain) G.chain = o.chain;
  /* 私事节点只记「缘由 · …」：别把它自己写进行程记录，
     否则回响里那句「也在这一路上」会引用到它自己。 */
  if(G.event.threadStep == null) addLog(G.event.title + ' · ' + o.label);
  if(o.reframe){
    const ttl = G.event.title;
    if(applyReframe(o.reframe)){ pushEcho({ t:'reframe', once:true, title:ttl }); return; }
  }
  afterOutcome((o.ok && o.ok.text) || '你继续上路。', changes);
}

function afterOutcome(text, changes){
  const t = G.event.title, ty = G.event.type;
  G.event = { id:'r_L'+G.layer+'_'+G.at, title:t, type:ty, text, options:[{ label:'继续', free:true }], fxOut:changes };
  G.pending = null; G.rerolls = 0; G.screen = 'event';
  recalc();
  render();
}

/* ---------- 检定 ---------- */
function renderCheck(){
  const o = G.pending.opt;
  const chk = o.check;
  const dc = effDC(chk.dc);
  /* 加成在 chooseOption 里定好并存进 pending，重掷时保持一致。
     旧存档里这个字段叫 riderBonus，一并兼容。 */
  const p = G.pending || {};
  let base = G.attrs[chk.attr] + (Number.isFinite(p.checkBonus) ? p.checkBonus : (p.riderBonus || 0));

  app.innerHTML = topbar() + statbar() + `
    <div class="card event">
      <div class="kicker">检定 · ${ATTRS[chk.attr]}</div>
      <h2>${esc(G.event.title)}</h2>
      <div class="prose"><p>${esc(o.label)}</p></div>
      <div class="rollbox">
        <div class="rollline">
          <span class="die rolling" id="die">?</span>
          <span>+ ${base} ${ATTRS[chk.attr]}</span>
          <span class="eq">vs DC ${dc}</span>
        </div>
        <div id="rollOut" class="hidden">
          <div class="rollline" style="margin-top:5px">
            <span class="res" id="rollRes"></span>
            <span class="mono" id="rollDetail"></span>
          </div>
        </div>
      </div>
    </div>`;

  const rnd = mulberry32(hashStr(G.seed+'|'+G.at+'|'+chk.attr+'|'+G.event.id+'|'+(G.rerolls||0)));
  let raw = rollD20(rnd);
  let calc = raw + base;
  let total = calc, traitNote = '', tier;

  /* 机运：命运偏袒（自然 1 → 自然 20）。
     改的是骰面，合计也得跟着改，否则明细会出现「20 + 4 = 5」。 */
  if(raw === 1 && G.rules && G.rules.luckReroll && !G.luckUsed){
    G.luckUsed = true; raw = 20;
    calc = raw + base; total = calc;
    traitNote = '命运的偏袒';
  }

  if(raw === 20) tier = 'crit';
  else if(raw === 1) tier = 'fumble';
  else {
    const m = calc - dc;
    tier = m >= 5 ? 'clean' : (m >= 0 ? 'cost' : 'fail');
  }

  if(tier === 'fail' && raw !== 1 && G.hero.id === 'ranger' && chk.attr === 'cunning' && (dc - calc) <= 2){
    tier = 'cost'; traitNote = '林中潜行';
  }
  if(tier === 'fail' && raw !== 1 && G.hero.id === 'lore' && chk.attr === 'lore' && !G.perLayerLore){
    total = calc + 2;
    const m2 = total - dc;
    if(m2 >= 5) tier = 'clean';
    else if(m2 >= 0) tier = 'cost';
    if(tier !== 'fail') traitNote = '博闻强识';
  }
  if(chk.attr === 'lore') G.perLayerLore = true;

  const ok = (tier === 'crit' || tier === 'clean' || tier === 'cost');
  const tierLabel = { crit:'大成功', clean:'成功', cost:'代价成功', fail:'失败', fumble:'大失败' }[tier];
  const dieClass = (tier === 'crit' || tier === 'clean') ? 'ok' : (tier === 'cost' ? 'cost' : 'no');
  const resClass = (tier === 'crit' || tier === 'clean') ? 'ok' : (tier === 'cost' ? 'cost' : 'no');

  const dieEl = $('die');
  let n = 0;
  const timer = setInterval(()=>{
    dieEl.textContent = 1 + Math.floor(Math.random()*20);
    if(++n > 9){
      clearInterval(timer);
      dieEl.textContent = raw;
      dieEl.className = 'die ' + dieClass;
      $('rollOut').classList.remove('hidden');
      $('rollRes').textContent = tierLabel;
      $('rollRes').className = 'res ' + resClass;
      $('rollDetail').textContent =
        `${raw} + ${base} = ${calc}${total !== calc ? ' + 2 = ' + total : ''} vs DC ${dc}` +
        (traitNote ? ' · ' + traitNote : '') +
        (raw === 20 ? ' · 自然 20' : '') + (raw === 1 ? ' · 自然 1' : '');
      showRollActions(tier, traitNote);
    }
  }, 45);
}

function showRollActions(tier, traitNote){
  const ok = (tier === 'crit' || tier === 'clean' || tier === 'cost');
  const acts = document.createElement('div');
  acts.className = 'btnrow';
  const freeReroll = !ok && (G.freeRerolls || 0) > 0;
  if(!ok && (G.resolve > 0 || freeReroll)){
    const b = document.createElement('button');
    b.className = 'btn sm';
    b.textContent = freeReroll ? '免费重掷（预习）' : '花 1 点决心重掷';
    b.onclick = ()=>{
      if(freeReroll) G.freeRerolls -= 1;
      else G.resolve -= 1;
      G.rerolls = (G.rerolls||0) + 1;
      addLog((freeReroll ? '免费重掷' : '花费决心重掷') + ' · ' + G.event.title);
      pushEcho({ t:'reroll', once:true, title:G.event.title });
      renderCheck();
    };
    acts.appendChild(b);
  }
  const acc = document.createElement('button');
  acc.className = 'btn primary sm';
  acc.textContent = ok ? (tier === 'cost' ? '接受这个结果' : '继续') : '接受这个结果';
  acc.onclick = ()=> settleCheck(tier, traitNote);
  acts.appendChild(acc);
  document.querySelector('.rollbox').appendChild(acts);
}

function settleCheck(tier, traitNote){
  const ok = (tier === 'crit' || tier === 'clean' || tier === 'cost');
  const o = G.pending.opt;
  const branch = (ok ? o.ok : o.no) || {};
  if(!ok) pushEcho({ t:'fail', title:G.event.title, label:o.label });

  /* 武勇：再起 */
  if(!ok && G.rules && G.rules.stand && !G.standUsed && G.hp <= 0){
    G.standUsed = true; G.hp = 1;
    addLog('再起：你没有倒下。');
  }
  if(!ok && G.hero.id === 'warden' && !G.wardenUsed && G.hp <= 3){
    G.wardenUsed = true; G.hp += 3;
    addLog('屹立不倒：你撑住了。');
  }

  /* 破阵的减伤在 applyFx 的统一扣血入口里做，这里不再重复处理 */
  const changes = applyFx(branch.fx || {}, { camp: G.event.type === 'camp' });
  if(branch.chain) G.chain = branch.chain;

  /* 大成功：额外回报 */
  if(tier === 'crit'){
    G.renown += 3;
    changes.push({ k:'大成功', v:'声望 +3' });
  }
  /* 代价成功：抽一条代价 */
  let costInfo = null;
  if(tier === 'cost'){
    costInfo = applyCost();
    pushEcho({ t:'cost', once:true, title:G.event.title });
  }

  const tierTxt = { crit:'大成功', clean:'成功', cost:'代价成功', fail:'失败', fumble:'大失败' }[tier];
  addLog(G.event.title + ' · ' + tierTxt + (traitNote ? '（'+traitNote+'）' : ''));

  if(ok && o.consume === 'token' && o.need && o.need.token){
    const tk = TOKENS[o.need.token];
    pushEcho({ t:'token', kind:'used', key:o.need.token, name:tk ? tk.name : o.need.token });
    G.tokens = (G.tokens||[]).filter(t=>t.id !== o.need.token);
  }
  if(ok && o.reframe){
    const ttl = G.event.title;
    if(applyReframe(o.reframe)){ pushEcho({ t:'reframe', once:true, title:ttl }); return; }
  }

  if(o.final){
    if(tier === 'cost' && costInfo) changes.push({ k:'代价', v:costInfo.fx.length ? costInfo.fx[0].v : '' });
    return endRun((ok && G.hp > 0) ? 'win' : 'dead');
  }

  const t = G.event.title, ty = G.event.type;
  G.event = {
    id: 'r_L' + G.layer + '_' + G.at,
    title: t, type: ty,
    text: (branch.text || '你继续上路。') + (costInfo ? '\n\n' + costInfo.text : ''),
    options: [{ label:'继续', free:true }],
    fxOut: changes
  };
  G.pending = null;
  G.rerolls = 0;
  G.screen = 'event';
  recalc();
  render();
}

/* ---------- 结算回响 ---------- */
/* 不写战报，只把这一局散落的东西轻轻放回原位。
   每一句都必须来自真实埋点；没发生过的事不写，凑不够也不硬凑。 */
function buildEcho(kind, reached){
  const es = Array.isArray(G.echoes) ? G.echoes : [];
  const of = t => es.filter(e => e.t === t);
  const first = t => of(t)[0];
  const last = t => of(t)[of(t).length - 1];
  const lastFail = last('fail'), lastStage = last('stage'), lastHurt = last('hurt');
  const breaks = of('gear').concat(of('loot'));
  const firstBreak = breaks.filter(e => e.kind === 'break')[0] || breaks[0];
  const letter = first('letter'), vow = first('vow');
  const region = last('region'), reframe = first('reframe');
  const taken = first('taken'), cost = first('cost'), reroll = first('reroll');
  const steady = first('steady'), resist = first('resist'), secured = first('secure');
  const th = G && G.thread, thDef = (typeof threadDef === 'function') ? threadDef() : null;
  /* 同行者与私事分开算：他的落点句也要进回响，但不能盖过这一局真正的大事 */
  let compEcho = '', compLayer = 3;
  if(G && G.companion){
    const cd = COMPANIONS.find(c => c.id === G.companion.id);
    if(cd){
      compEcho = G.companion.used > 0 ? cd.echoStay : cd.echoIdle;
      compLayer = G.companion.firstLayer || 3;
    }
  } else if(G && G.companionLeft){
    const cd = COMPANIONS.find(c => c.id === G.companionLeft.id);
    if(cd){ compEcho = cd.echoLeft.replace('{n}', G.companionLeft.layer); compLayer = G.companionLeft.layer; }
  }
  const gotToken = of('token').filter(e => e.kind === 'got')[0];
  const usedToken = of('token').filter(e => e.kind === 'used')[0];
  const paras = [];
  let usedFail = false, usedStage = false;

  /* 第一段：这一局怎么收的尾。只写结局本身，不替它解释原因 */
  if(kind === 'dead' && lastFail){
    paras.push('第 ' + lastFail.layer + ' 程，「' + lastFail.title + '」。你试过「' + lastFail.label + '」，没成。\n\n那之后你没有再试第二次。');
    usedFail = true;
  } else if(kind === 'dead' && lastHurt){
    paras.push('第 ' + lastHurt.layer + ' 程，' + (lastHurt.cause === 'supply'
      ? '补给见了底。' : '有东西跟上来了一点。'));
  } else if(kind === 'shadow' && lastStage){
    paras.push('「' + lastStage.name + '」那天，你还在走。之后也一直在走。');
    usedStage = true;
  } else if(kind === 'retreat'){
    paras.push('回头是在第 ' + reached + ' 程决定的。来时的路你刚走过一遍。');
  } else if(kind === 'win'){
    paras.push('第 ' + reached + ' 程走完了。最后一段路上你没有再回头。');
  } else {
    paras.push('最后几程没有遇到需要掷骰的事。');
  }

  /* 第二段起：这一局独有的痕迹。按分量排序，同分按发生先后。
     结局会抬高相关痕迹的权重 —— 倒下的人记得那次没成，
     堕入阴影的人记得第一条被划掉的路。 */
  const bias = {
    dead:    { fail:3, gear:2, hurt:1, cost:1 },
    shadow:  { taken:4, stage:3, resist:3, reframe:1 },
    retreat: { region:3, letter:2, reroll:1 },
    win:     { vow:3, resist:3, reframe:2, region:1 }
  }[kind] || {};
  const pool = [];
  const add = (type, base, e, s) => {
    if(e && s) pool.push({ w:base + (bias[type]||0), layer:e.layer || 0, n:pool.length, s });
  };

  /* 这一趟的私事：三种落点。办成是稀有的高潮，可以压过别的痕迹；
     半成 / 没办成是常态，权重放低，否则每局都写同一句，回响会退化成模板。
     前半句用最后一次真实点过的选项，同一条私事在不同局里不会长成一个样。 */
  if(thDef && th && (th.pushes > 0 || th.dropped)){
    const s = kind === 'shadow' ? thDef.echoLost
      : th.done ? thDef.echoDone
      : (th.pushes >= 2 ? thDef.echoHalf : thDef.echoLost);
    const w = th.done ? 9 : (th.pushes >= 2 ? 8 : 7);
    const lastStep = last('thread');
    const mem = (typeof threadMemory === 'function') ? threadMemory() : '';
    const lead = (lastStep && lastStep.label)
      ? '第 ' + lastStep.layer + ' 程，「' + lastStep.label + '」。'
        + (mem ? '「' + mem + '」也在这一路上。' : '')
      : '';
    add('thread', w, { layer: th.firstLayer || 1 }, lead + s);
  }
  if(compEcho) add('companion', 6, { layer: compLayer }, compEcho);
  if(resist) add('resist', 9, resist, '到顶上那一次，你把名字又说了一遍。');
  if(steady) add('steady', 8, steady,
    '第 ' + steady.layer + ' 程你停下来，把出发时别人叫你的名字念了一遍。');
  if(letter && kind !== 'win') add('letter', 9, letter, '内袋里那半页纸还在。上面的名字你到现在还写得出来。');
  if(vow) add('vow', 9, vow, '第 ' + vow.layer + ' 程你立过誓。要走到的地方还在前面。');
  if(firstBreak){
    const pick = of('pick').filter(e => e.name === firstBreak.name && e.layer < firstBreak.layer)[0];
    const verb = firstBreak.kind === 'break' ? '坏的。碎的时候你没有停。' : '磕出一道口的。你没有停下来看。';
    add('gear', 8, firstBreak, pick
      ? '「' + firstBreak.name + '」是第 ' + pick.layer + ' 程捡的，第 ' + firstBreak.layer + ' 程' + verb
      : '「' + firstBreak.name + '」是第 ' + firstBreak.layer + ' 程' + verb);
  }
  if(reframe) add('reframe', 8, reframe,
    '第 ' + reframe.layer + ' 程，「' + reframe.title + '」，你蹲下来看清了一处。后来那道题就不在了。');
  if(gotToken) add('token', 7, gotToken, usedToken
    ? '「' + gotToken.name + '」是第 ' + gotToken.layer + ' 程记下的，第 ' + usedToken.layer + ' 程用掉了。'
    : '「' + gotToken.name + '」是第 ' + gotToken.layer + ' 程记下的，一直到结束都没用上。');
  if(region) add('region', 7, region,
    '第 ' + region.layer + ' 程，路从「' + region.from + '」换成了「' + region.to + '」。名字换过一次，脚步没有。');
  if(lastHurt && kind !== 'dead') add('hurt', 7, lastHurt,
    lastHurt.cause === 'supply' ? '第 ' + lastHurt.layer + ' 程补给见了底，后面一直在省着走。'
                                : '第 ' + lastHurt.layer + ' 程有东西跟上来了一点，你没停。');
  if(lastFail && !usedFail) add('fail', 7, lastFail,
    '第 ' + lastFail.layer + ' 程那次没成的事，后来也没有再补上。');
  if(lastStage && !usedStage) add('stage', 7, lastStage,
    '「' + lastStage.name + '」那天之后，你回头看的次数变少了。');
  if(taken) add('taken', 6, taken,
    '第 ' + taken.layer + ' 程，「' + taken.title + '」，第一条温和的路被划掉了。你记得它写过什么。');
  if(secured) add('secure', 6, secured,
    '第 ' + secured.layer + ' 程把「' + secured.name + '」裹进了行囊最底层。');
  if(cost) add('cost', 5, cost, '第 ' + cost.layer + ' 程那次成了，代价是当场付的。');
  if(reroll) add('reroll', 5, reroll,
    '第 ' + reroll.layer + ' 程花过一点决心，把同一件事重新掷了一次。');

  pool.sort((a,b) => b.w - a.w || a.layer - b.layer || a.n - b.n);
  pool.slice(0, 2).forEach(x => paras.push(x.s));
  if(paras.length < 2) paras.push('这一程没有碎过什么东西。');

  const tail = {
    dead: '路是从夏尔那头数过来的，数到第 ' + reached + ' 程停了。',
    shadow: '到了这里，你已经不需要决定什么了。',
    retreat: '回去会快一些。你没有数还剩多少路。',
    win: '回头数，一共 ' + reached + ' 程。'
  };
  if(tail[kind]) paras.push(tail[kind]);
  return paras.slice(0, 4).join('\n\n');
}

/* ---------- 结算 ---------- */
function endRun(kind){
  if(G.shadow >= SHADOW_MAX && kind !== 'dead') kind = 'shadow';
  G.hp = Math.max(0, G.hp);
  G.supply = Math.max(0, G.supply);
  G.resolve = Math.max(0, G.resolve);
  const reached = G.layer + 1;
  let renown = reached*4 + Math.max(0,G.hp)*2 + G.renown;
  let mats = G.materials;
  const loot = Array.isArray(G.loot) ? G.loot : [];
  /* 收好的和散着的先分开算：收好是玩家花过决心的保底，不占结局的额度 */
  const secured = loot.filter(l => l.sec);
  const loose = loot.filter(l => !l.sec);
  let kept = [];

  if(kind === 'win'){
    kept = secured.concat(loose); mats += 3;
    if(G.vow){ renown += 25; }
  }
  else if(kind === 'retreat'){
    renown = Math.floor(renown * 0.5);
    /* 回头要轻装：收好的先装进包，其余默认只带走一半；点亮「不退」才全带 */
    const full = !!(G.rules && G.rules.retreatFull);
    kept = secured.concat(full ? loose : loose.slice(0, Math.ceil(loose.length / 2)));
    mats = Math.floor(mats * 0.5);
  } else if(kind === 'shadow'){
    renown = Math.floor(renown * 0.2);
    /* 走到这一步的人什么也带不走，收好的也一样：这是结局，不是运气 */
    kept = []; mats = 0;
  } else {
    renown = Math.floor(renown * 0.3);
    /* 倒下：收好的都在，再加上手里最后攥着的那一件 */
    kept = secured.concat(loose.length ? [loose[loose.length - 1]] : []);
    mats = 0;
  }

  /* 入库：重复藏品不再被静默吞掉 —— 带回的强化更高就升级，
     否则按品质折成材料，玩家至少看得见这一趟没有白跑。 */
  let added = 0, upgraded = 0, melted = 0, meltMats = 0;
  for(const l of kept){
    const it = ITEMS[l.id];
    if(!it) continue;
    const plus = l.plus || 0;
    const had = META.armory[l.id];
    if(had == null){ META.armory[l.id] = plus; added++; }
    else if(plus > had){ META.armory[l.id] = plus; upgraded++; }
    else { meltMats += 1 + (it.q || 0); melted++; }
  }
  mats += meltMats;

  /* 这一趟的私事：办成了才有回报，且不再受结局折损影响；堕影的人什么也带不走。
     推到一半给一半，放下或没走到则一分没有。 */
  const th = G.thread, thDef = threadDef();
  let threadState = 'none', threadBonus = 0, threadMats = 0;
  if(th && thDef){
    if(kind === 'shadow') threadState = 'lost';
    else if(th.done){
      threadState = 'done';
      threadBonus = thDef.reward.renown; threadMats = thDef.reward.materials;
    } else if(th.pushes >= 2){
      threadState = 'half';
      threadBonus = Math.floor(thDef.reward.renown / 2);
      threadMats = Math.floor(thDef.reward.materials / 2);
    } else threadState = th.dropped ? 'dropped' : 'lost';
  }
  renown += threadBonus;
  mats += threadMats;
  const threadLine = thDef ? ({
    done:'这一趟的私事办成了：' + thDef.name + '。声望 +' + threadBonus + ' · 材料 +' + threadMats + '。',
    half:'「' + thDef.name + '」只带到半路。声望 +' + threadBonus + ' · 材料 +' + threadMats + '。',
    dropped:'你把「' + thDef.name + '」放在了路上。',
    lost:'「' + thDef.name + '」没有办成。',
    none:''
  })[threadState] : '';

  /* 同行者：还在、走了、一次没用上，三种落点。
     陪到最后且还有信任，多给 4 点声望 —— 他愿意再跟你走一段。 */
  let compState = 'none', compLine = '', compBonus = 0;
  if(G.companion){
    const cd = COMPANIONS.find(c => c.id === G.companion.id);
    if(cd){
      compState = G.companion.used > 0 ? 'stay' : 'idle';
      compLine = compState === 'stay' ? cd.echoStay : cd.echoIdle;
      if(kind !== 'shadow' && G.companion.trust > 0){ compBonus = 4; renown += compBonus; }
    }
  } else if(G.companionLeft){
    compState = 'left';
    const cd = COMPANIONS.find(c => c.id === G.companionLeft.id);
    if(cd) compLine = cd.echoLeft.replace('{n}', G.companionLeft.layer);
  }

  if(G.hero.rule === 'nameless') renown = Math.round(renown * 1.4);
  META.renown += renown;
  META.materials += mats;
  META.runs += 1;
  if(kind === 'win'){
    META.wins += 1;
    if(G.tierId >= META.maxTier && G.tierId < TIERS.length) META.maxTier = G.tierId + 1;
  }
  if(renown > META.best) META.best = renown;
  saveMeta(META);

  /* 倒下、堕入阴影、或回头没带走的，都要在结算页列出来。
     kept 里装着的对象都来自 loot，用引用差集算 lost：收好的排在前面，
     再按 kept.length 去切 slice 会把账算错。 */
  const lost = loot.filter(l => kept.indexOf(l) < 0);
  G.over = { kind, reached, renown, mats, kept, added, upgraded, melted, meltMats,
             armoryTotal: Object.keys(META.armory).length,
             threadState, threadBonus, threadMats, threadLine,
             compState, compLine, compBonus,
             lost, echo: buildEcho(kind, reached) };
  G.screen = 'result';
  clearRun();
  render();
}

function renderResult(){
  const o = G.over;
  const titles = { win:'走完了这一程', retreat:'你选择了回头', dead:'倒在了路上', shadow:'你走到了，但没有回来' };
  const lines = {
    win:'路在这里断了一下，然后继续往东。你还在走。',
    retreat:'回头不是认输。你知道自己还能再走一次，而这一次已经够了。',
    dead:'你听见自己的呼吸越来越远。最后想起的是出发时那条路的样子。',
    shadow:'路确实有尽头。你到了那里，然后停住了。\n\n你没有回头。不是因为不想，是因为你已经想不起要回头看什么。'
  };
  const keptHtml = o.kept && o.kept.length
    ? o.kept.map(l=>{
        const it = ITEMS[l.id];
        return `<span class="fx ${o.kind==='dead'?'bad':'good'}">${it?esc(it.name):l.id}${l.plus?' +'+l.plus:''}${l.sec?' · 收好':''}</span>`;
      }).join('')
    : '<span class="fx bad">什么也没带回来</span>';

  /* 入库明细：新增 / 强化 / 重复折材料，逐项写清，不让玩家猜东西去哪了 */
  const haul = [];
  if(o.added) haul.push('新藏品 ' + o.added + ' 件');
  if(o.upgraded) haul.push('强化 ' + o.upgraded + ' 级');
  if(o.melted) haul.push('重复 ' + o.melted + ' 件折成 ' + o.meltMats + ' 材料');
  const haulTxt = (o.kept && o.kept.length)
    ? '<br>入库：' + (haul.length ? haul.join(' · ') : '带回的都已经有了，这次什么也没添上')
      + '。军械库现有 ' + o.armoryTotal + ' 件。'
    : '';

  const lostHtml = o.lost && o.lost.length
    ? `<p class="note" style="margin-top:14px;margin-bottom:6px">${o.kind==='retreat' ? '留在了身后：' : '留在了荒野里：'}</p>
       <div class="fxlist">${o.lost.map(l=>{
         const it = ITEMS[l.id];
         return `<span class="fx lost">${it?esc(it.name):l.id}${l.plus?' +'+l.plus:''}${l.sec?' · 收好':''}</span>`;
       }).join('')}</div>`
    : '';

  const echoHtml = o.echo
    ? `<div class="card echo-card"><div class="ek">回响</div><div class="prose">${String(o.echo).split('\n').filter(x=>x.trim()).map(p=>`<p>${esc(p)}</p>`).join('')}</div></div>`
    : '';

  app.innerHTML = topbar() + `
    <div class="card pad" style="text-align:center;padding-top:32px">
      <div style="font-size:11px;letter-spacing:.18em;color:var(--gold);margin-bottom:9px">远征结束</div>
      <h1 style="font-size:26px">${titles[o.kind]}</h1>
      <p class="prose" style="margin-top:12px;font-size:15px">${lines[o.kind]}</p>
    </div>

    ${echoHtml}

    <div class="summary">
      <div><div class="k">抵达</div><div class="v">第 ${o.reached} / ${TOTAL_LAYERS} 程</div></div>
      <div><div class="k">获得声望</div><div class="v">${o.renown}</div></div>
      <div><div class="k">材料</div><div class="v">${o.mats}</div></div>
      <div><div class="k">累计声望</div><div class="v">${META.renown}</div></div>
    </div>

    <div class="card pad" style="margin-top:14px">
      <h3>战利品</h3>
      <div class="fxlist" style="margin-top:9px">${keptHtml}</div>
      ${lostHtml}
      <p class="note">${o.kind==='dead'
        ? (o.kept && o.kept.length > 1
            ? '倒下时，收好的东西和手里最后攥着的那一件留了下来。其余的留在了荒野里。'
            : (o.kept && o.kept.length
                ? '倒下时，你手里还攥着一样东西。其余的留在了荒野里。'
                : '倒下时，身上的一切都留在了荒野里。'))
        : o.kind==='retreat'
          ? (o.lost && o.lost.length
              ? '回头路上走得急：收好的先装进包，其余只带走了一半。'
              : '回头路上走得急，但一样也没落下。')
          : o.kind==='shadow'
            ? (o.lost && o.lost.some(l=>l.sec)
                ? '连收好的也没能带回来。身上的一切都留在了荒野里。'
                : '身上的一切都留在了荒野里。')
            : '带回来的东西已经存入军械库。'}${haulTxt}</p>
      ${o.threadLine ? `<p class="note" style="margin-top:12px;color:var(--gold)">${esc(o.threadLine)}</p>` : ''}
      ${o.compLine ? `<p class="note" style="margin-top:8px;color:#3d5a7a">${esc(o.compLine)}</p>` : ''}
    </div>

    ${o.kind==='win' && G.tierId < TIERS.length ? `<p class="note" style="text-align:center;color:var(--gold)">难度 ${G.tierId+1} 已解锁。</p>` : ''}

    <div class="btnrow">
      <button class="btn primary" id="again">再走一次</button>
      <button class="btn ghost" id="toCamp">回营地</button>
      <button class="btn ghost" id="toTitle2">回到起点</button>
    </div>

    <div class="logbox"><div class="k">行程记录</div><ul class="loglist">${G.log.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`;

  $('again').onclick = ()=> newGame(G.hero.id, G.tierId, randSeed());
  $('toCamp').onclick = ()=>{ G = null; renderCamp(); };
  $('toTitle2').onclick = ()=> toTitle();
}

/* ---------- 存档 ---------- */
function saveRun(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G)); }catch(e){}
}
function loadRun(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || !d.map || !d.map.index) return null;
    /* 旧版本存下来的局没有这些字段。补齐默认值，刷新后行为不会悄悄停摆；
       天赋规则按当前 META 重算一次，新接线的规则在半途的旧档里也能生效。 */
    const tf = talentFx();
    d.rules = Object.assign({}, d.rules || {}, tf.rules);
    if(!Number.isFinite(d.freeRerolls)) d.freeRerolls = tf.rules.extraReroll ? 1 : 0;
    if(!Number.isFinite(d.eventCount)) d.eventCount = 0;
    if(!Array.isArray(d.echoes)) d.echoes = [];
    /* v0.5 新增：旧存档没有这两项，补默认值后刷新即可继续用新机制 */
    if(!Number.isFinite(d.steadyLeft)) d.steadyLeft = 2;
    if(typeof d.shadowResistUsed !== 'boolean') d.shadowResistUsed = false;
    /* v0.6 新增：旧存档没有「收好」字段，补齐后刷新就能继续用 */
    if(!Number.isFinite(d.secLeft)) d.secLeft = SEC_LIMIT;
    if(!Array.isArray(d.loot)) d.loot = [];
    /* v0.7：旧档没有缘由，保持 null —— 不凭空给进行中的局塞一条线 */
    if(d.thread === undefined) d.thread = null;
    /* v0.8：旧档没有同行者，按「这一局还没遇上」处理 */
    if(d.companion === undefined) d.companion = null;
    if(d.companionMet !== true) d.companionMet = false;
    if(d.companionLeft === undefined) d.companionLeft = null;
    if(d.pending && !Number.isFinite(d.pending.checkBonus)){
      d.pending.checkBonus = Number.isFinite(d.pending.riderBonus) ? d.pending.riderBonus : 0;
    }
    return d;
  }catch(e){ return null; }
}
function clearRun(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ---------- 12. 启动 ---------- */
(function boot(){
  let q = null;
  try{ if(typeof location !== 'undefined') q = new URLSearchParams(location.search); }catch(e){}
  const seed = q && q.get('seed');
  const hero = q && q.get('hero');
  const tier = q && q.get('tier');
  const want = q && q.get('screen');

  /* 调试/预览入口：直接打开营地类页面 */
  if(want === 'camp' || want === 'talents' || want === 'armory'){
    META = defaultMeta();
    META.renown = 48; META.materials = 12; META.maxTier = 4;
    META.armory = { sword:2, mail:1, dagger:1, cloak:0, ring:0 };
    META.loadout = { main:'sword', body:'mail' };
    META.talents = ['v1','v2','v3','l1','l2','k1'];
    META.runs = 7; META.wins = 2; META.best = 63;
    if(want === 'camp') return renderCamp();
    if(want === 'talents') return renderTalents();
    return renderArmory();
  }

  if(seed && hero && HEROES.some(h=>h.id===hero)){
    newGame(hero, tier?+tier:1, seed);
    /* 调试：给几件随身战利品，用来预览确认 */
    if(q.get('loot')){
      G.loot = [{id:'sword',plus:1},{id:'mail',plus:0},{id:'ring',plus:2},{id:'cloak',plus:0}];
    }
    if(want === 'map'){ G.screen = 'map'; render(); }
    /* 调试：直接看结算页（dead / win / retreat / shadow） */
    if(want === 'result'){
      G.loot = [{id:'sword',plus:1},{id:'mail',plus:0},{id:'ring',plus:2}];
      G.layer = 7;
      if(q.get('kind') === 'dead') G.hp = 0;
      endRun(q.get('kind') || 'dead');
    }
    if(want === 'ev'){
      const wantId = q.get('ev');
      const ev = EVENTS.find(e=>e.id===wantId);
      if(ev){
        G.tokens = [{ id:'ferry_rope', name:TOKENS.ferry_rope.name, note:'' }];
        if(q.get('shadow')) G.shadow = +q.get('shadow');
        let view = regionVariant(ev, layerRegion(G.layer));
        view = injectShadowOptions(view);
        view = noteTaken(takeGentleOptions(view));
        view = injectObserveOption(view);
        G.event = shadowVariant(view);
        G.screen = 'event'; render();
      }
    }
    if(want === 'gate'){
      const ev = EVENTS.find(e=>e.id==='gate_chain');
      if(ev){
        G.shadow = 3;
        G.tokens = [{ id:'ferry_rope', name:TOKENS.ferry_rope.name, note:'' }];
        G.event = ev; G.screen = 'event'; render();
      }
    }
    if(want === 'shadow'){
      G.shadow = 5;
      const enc = Object.values(G.map.index).find(n=>n.type==='encounter');
      if(enc){
        G.at = enc.id; G.layer = enc.layer;
        const ev = pickEvent(enc);
        if(ev){
          let view = injectShadowOptions(ev);
          view = noteTaken(takeGentleOptions(view));
          view = injectObserveOption(view);
          G.event = shadowVariant(view);
          G.screen = 'event'; render();
        }
      }
    }
    /* URL 调试入口已经开好局，不必再恢复存档 */
    return;
  }

  /* 刷新 / 切后台回来：接上没走完的那一局。
     endRun 会 clearRun，所以存档里只可能是进行中的局；旧档没有 echoes，补上空数组。 */
  const saved = loadRun();
  if(saved && !saved.over && saved.map && saved.map.index){
    G = saved;
    if(!Array.isArray(G.echoes)) G.echoes = [];
    render();
    return;
  }
  renderTitle();
})();

</script>
