<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中土远征 · 文字跑团</title>
<style>
:root{
  --paper:#f1e9d8; --panel:#faf5e9; --panel-2:#f6efe0; --panel-3:#fdfaf2;
  --ink:#382b1b; --ink-2:#6b5a41; --ink-3:#98866c; --ink-4:#b6a68c;
  --line:#dbcbab; --line-2:#e9ddc4;
  --gold:#96682c; --gold-2:#b8873f; --gold-3:#e2c894;
  --blood:#8a3a2a; --moss:#4d6b3a; --indigo:#3d5a7a;
  --serif:Georgia,"Songti SC","Noto Serif SC","Source Han Serif SC",SimSun,serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); color:var(--ink); background-color:var(--paper);
  background-image:
    radial-gradient(ellipse at 12% -5%,rgba(255,253,246,.95) 0%,rgba(255,253,246,0) 58%),
    radial-gradient(ellipse at 88% 105%,rgba(188,163,119,.38) 0%,rgba(188,163,119,0) 58%);
  background-attachment:fixed; font-size:15px; line-height:1.7; min-height:100vh;
}
#app{max-width:880px;margin:0 auto;padding:26px 20px 72px}
.hidden{display:none !important}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:.02em}
h1{font-size:28px;line-height:1.35}
h2{font-size:19px;line-height:1.5}
h3{font-size:15px;line-height:1.5}
.mono{font-family:var(--mono);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(74,58,34,.05)}
.pad{padding:22px 24px}
.rule{height:1px;background:var(--line-2);border:0;margin:16px 0}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:13px;margin-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:16px;letter-spacing:.16em;color:var(--gold);cursor:pointer}
.brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.2em;color:var(--ink-3);margin-top:3px}
.metabar{display:flex;gap:16px;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.metabar b{font-weight:400;color:var(--gold)}

.statbar{display:flex;gap:20px;flex-wrap:wrap;padding:13px 18px;margin-bottom:18px}
.stat{min-width:92px}
.stat .k{font-size:11px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:3px}
.stat .v{font-family:var(--mono);font-size:15px}
.bar{height:3px;background:var(--line-2);border-radius:2px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;transition:width .35s ease}
.bar.hp i{background:var(--blood)} .bar.sp i{background:var(--moss)} .bar.rs i{background:var(--gold-2)}
.stat.low .v{color:var(--blood)}
.attrs{display:flex;gap:7px;flex-wrap:wrap;margin-top:3px}
.attr{font-size:12px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:4px;padding:2px 8px;background:var(--panel-2)}
.attr b{font-family:var(--mono);font-weight:400;color:var(--ink);font-size:13px}

.btn{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:9px 18px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:#f0e5cf;border-color:var(--gold-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#fdf8ee}
.btn.primary:hover{background:#a57433}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary:disabled{background:var(--panel-2);border-color:var(--line);color:var(--ink-3);opacity:1}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}

.title-screen{text-align:center;padding:38px 20px 8px}
.title-screen .eyebrow{font-size:11px;letter-spacing:.32em;color:var(--ink-3);margin-bottom:14px}
.title-screen h1{font-size:34px;margin-bottom:10px}
.title-screen .lede{font-family:var(--serif);font-size:15px;color:var(--ink-2);max-width:460px;margin:0 auto;line-height:1.95}

.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:10px;grid-auto-rows:1fr}
.pick2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:10px}
.pickgrid.four{grid-template-columns:repeat(4,1fr)}
.pick{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:14px 13px;cursor:pointer;transition:.15s;text-align:left;font-family:var(--sans);color:var(--ink)}
.pick:hover{border-color:var(--gold-3);background:#f7efdd}
.pick.on{border-color:var(--gold);background:#f7eeda;box-shadow:inset 0 0 0 1px var(--gold-3)}
.pick.off{opacity:.42;cursor:not-allowed}
.pick .n{font-family:var(--serif);font-size:16px;margin-bottom:2px}
.pick .s{font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
.pick .a{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);line-height:1.8}
.pick .t{font-size:11.5px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-2);line-height:1.6}
.field{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.field input{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;width:210px;outline:none}
.field input:focus{border-color:var(--gold-3)}

/* 地区进度 */
.stepper{display:flex;align-items:center;gap:0;padding:14px 22px 6px;font-size:12px}
.step{display:flex;align-items:center;gap:7px;color:var(--ink-4)}
.step.on{color:var(--gold)}
.step.done{color:var(--ink-2)}
.step .dot2{width:6px;height:6px;border-radius:50%;background:var(--line)}
.step.on .dot2{background:var(--gold)}
.step.done .dot2{background:var(--ink-2)}
.step-line{flex:1;height:1px;background:var(--line-2);margin:0 10px;min-width:10px}
.step .abbr{display:none}

/* 地图 */
.mapwrap{padding:4px 4px 2px}
.mapscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mapscroll svg{width:100%;height:auto;display:block}
.maplegend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:6px 0 16px;font-size:11.5px;color:var(--ink-3)}
.maplegend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;border:1px solid}
.node-g{cursor:pointer}
.node-g.avail:hover .ring{stroke:#96682c;stroke-width:2}
.node-g.locked{cursor:default}

/* 事件 */
.event{padding:24px 26px}
.event .kicker{font-size:11px;letter-spacing:.16em;color:var(--gold);margin-bottom:8px}
.event h2{margin-bottom:14px;font-size:20px}
.prose{font-family:var(--serif);font-size:16.5px;line-height:2;color:#3f3221}
.prose p+p{margin-top:11px}
.opts{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:baseline;gap:12px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);padding:11px 15px;cursor:pointer;text-align:left;font-size:14px;color:var(--ink);transition:.15s;width:100%;font-family:var(--sans);line-height:1.6}
.opt:hover{border-color:var(--gold-3);background:#f7efdd}
.opt .idx{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:0 0 auto;padding-top:2px}
.opt .lbl{flex:1}
.opt .dc{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:0 0 auto;white-space:nowrap;padding-top:2px}
.rollbox{margin-top:20px;padding:18px 20px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line-2)}
.rollline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.die{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:#fffdf7;font-size:19px;color:var(--ink);font-family:var(--mono)}
.die.rolling{color:var(--ink-3)} .die.ok{border-color:var(--moss);color:var(--moss)} .die.no{border-color:var(--blood);color:var(--blood)}
.res{font-family:var(--sans);font-size:14px;font-weight:500}
.res.ok{color:var(--moss)} .res.no{color:var(--blood)}
.outcome{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line-2)}
.fxlist{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.fx{font-family:var(--mono);font-size:11.5px;padding:2px 9px;border-radius:4px;border:1px solid var(--line-2);background:#fffdf7;color:var(--ink-2)}
.fx.bad{color:var(--blood);border-color:#e3c9c2}
.fx.good{color:var(--moss);border-color:#ccd9bf}

/* 营地 / 天赋 / 军械库 */
.campgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:14px}
.campcard{border:1px solid var(--line);border-radius:9px;background:var(--panel-2);padding:16px;cursor:pointer;transition:.15s;text-align:left;font-family:var(--sans);color:var(--ink)}
.campcard:hover{border-color:var(--gold-3);background:#f7efdd}
.campcard .n{font-family:var(--serif);font-size:15px;margin-bottom:4px}
.campcard .d{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.campcard .badge{font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:8px}

.talentbranch{margin-top:18px}
.talentbranch h3{font-size:14px;color:var(--ink-2);margin-bottom:2px}
.talentbranch .bsub{font-size:11.5px;color:var(--ink-3);margin-bottom:12px}
.trow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:9px}
.trow.two{grid-template-columns:repeat(2,1fr);width:66.2%}
.tnode{border:1px solid var(--line);border-radius:7px;background:var(--panel-2);padding:10px 12px;font-family:var(--sans);text-align:left;color:var(--ink);cursor:pointer;transition:.15s;font-size:12.5px;line-height:1.55}
.tnode:hover{border-color:var(--gold-3)}
.tnode .tn{font-size:13px;font-family:var(--serif);margin-bottom:3px}
.tnode .td{font-size:11px;color:var(--ink-3);line-height:1.5}
.tnode .tc{font-family:var(--mono);font-size:10.5px;color:var(--gold);margin-top:5px}
.tnode.on{border-color:var(--gold);background:#f7eeda}
.tnode.on .tc{color:var(--moss)}
.tnode.locked{opacity:.45;cursor:not-allowed}

.slotrow{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line-2)}
.slotrow:last-child{border-bottom:0}
.slotname{font-size:12px;color:var(--ink-3)}
.slotval{font-size:13.5px}
.slotval.empty{color:var(--ink-4)}
.itemlist{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}
.itemcard{border:1px solid var(--line);border-radius:7px;background:var(--panel-2);padding:11px 13px;text-align:left;font-family:var(--sans);color:var(--ink);cursor:pointer;font-size:12.5px;line-height:1.55}
.itemcard:hover{border-color:var(--gold-3);background:#f7efdd}
.itemcard.on{border-color:var(--gold);background:#f7eeda}
.itemcard .iname{font-size:13.5px;font-family:var(--serif);display:flex;justify-content:space-between;gap:8px}
.itemcard .iplus{font-family:var(--mono);font-size:11px;color:var(--gold)}
.itemcard .ifx{font-size:11px;color:var(--ink-3);margin-top:3px}

/* 结算 */
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:8px;overflow:hidden;margin-top:16px}
.summary div{background:var(--panel);padding:12px 16px;display:block}
.summary .k{font-size:11px;line-height:1.4;letter-spacing:.1em;color:var(--ink-3)}
.summary .v{font-size:17px;line-height:1.35;margin-top:3px;font-variant-numeric:tabular-nums}
.logbox{margin-top:22px;border-top:1px solid var(--line);padding-top:13px}
.logbox .k{font-size:11px;letter-spacing:.14em;color:var(--ink-3);margin-bottom:7px}
.loglist{font-size:12.5px;color:var(--ink-2);line-height:1.9;max-height:150px;overflow:auto}
.loglist li{list-style:none;padding-left:14px;position:relative}
.loglist li::before{content:"·";position:absolute;left:2px;color:var(--gold-3)}
.note{font-size:12px;color:var(--ink-3);line-height:1.75;margin-top:12px}
.warn{font-size:12.5px;color:var(--blood);margin-top:10px}

@media (max-width:640px){
  #app{padding:16px 13px 60px}
  .pickgrid,.pickgrid.four{grid-template-columns:1fr 1fr}
  .pick2{grid-template-columns:1fr}
  .campgrid{grid-template-columns:1fr}
  .event{padding:19px 17px}
  .pad{padding:17px}
  .prose{font-size:16px}
  h1{font-size:23px}
  .title-screen h1{font-size:26px}
  .topbar{flex-direction:column;align-items:flex-start;gap:7px;margin-bottom:14px}
  .metabar{gap:12px;flex-wrap:wrap}
  .statbar{gap:13px 15px;padding:11px 13px}
  .stat{min-width:calc(33.333% - 11px)}
  .stat:last-child{flex:1 0 100%;border-top:1px solid var(--line-2);padding-top:9px}
  .mapscroll svg{min-width:460px}
  .stepper{padding:12px 14px 4px;font-size:11.5px;justify-content:flex-start;gap:18px;flex-wrap:wrap}
  .step .full{display:none}
  .step .abbr{display:inline}
  .step-line{display:none}
  .mapfoot{flex-direction:column;align-items:flex-start;gap:9px}
  .trow{grid-template-columns:1fr 1fr}
  .itemlist{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr 1fr}
}

/* 阴影 / 代价 */
.opt.shadow-opt{border-left:3px solid var(--blood);border-color:#d8b7a4;background:#f8eee5}
.opt.shadow-opt:hover{border-color:var(--blood);background:#f5e6dd}
.opt.shadow-opt .idx,.opt.shadow-opt .dc{color:var(--blood)}
.die.cost{border-color:var(--gold);color:var(--gold)}
.res.cost{color:var(--gold)}
.costbox{margin-top:14px;padding:10px 14px;border-radius:6px;background:#fbf3e2;border:1px solid #e4d3b2;border-left:3px solid var(--gold)}
.costbox .ck{font-size:10.5px;letter-spacing:.18em;color:var(--gold);margin-bottom:3px}
.costbox .ct{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.shadowbar{display:flex;align-items:center;gap:11px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--ink-2);
  background:#f8efe7;border:1px solid #e2cbb8;border-left:3px solid var(--blood);border-radius:6px;flex-wrap:wrap}
.shadowbar .sname{color:var(--blood);font-weight:500;letter-spacing:.04em}
.shadowbar .strack{flex:1;min-width:60px;height:3px;background:#e8d5c6;border-radius:2px;overflow:hidden}
.shadowbar .strack i{display:block;height:100%;background:var(--blood);transition:width .4s ease}
@media (max-width:640px){
  .shadowbar{padding:9px 12px;font-size:11.5px;gap:8px}
}

.opt.locked-opt{opacity:.62;cursor:not-allowed;background:var(--panel-2)}
.opt.locked-opt:hover{border-color:var(--line);background:var(--panel-2)}
.opt.locked-opt .dc{color:#9a7f5f;font-weight:500}
.opt.auto-opt{border-left:3px solid var(--moss)}
.opt.auto-opt .idx,.opt.auto-opt .dc{color:var(--moss)}
.tokenbar{margin-top:14px;padding:8px 12px;border-radius:6px;background:#f1f6ec;border:1px solid #d4e0c6;font-size:11.5px;color:#4a5f3a;line-height:1.7}

.pickgrid.four .pick{min-height:200px}
.attrs4{display:grid;grid-template-columns:1fr 1fr;gap:0 6px;line-height:1.75}
@media (max-width:640px){ .pickgrid.four .pick{min-height:0} }

.tiergrid{grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){ .tiergrid{grid-template-columns:1fr 1fr} }

.opt.auto-opt.locked-opt{border-left-color:#cfc2ab}

/* 存档导出 / 导入 */
.savebox{margin-top:18px;padding:16px 18px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2)}
.savebox .sk{font-size:11px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:7px}
.savebox .sd{font-size:12.5px;line-height:1.8;color:var(--ink-2);margin:0 0 12px}
.savebox textarea{width:100%;box-sizing:border-box;min-height:92px;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--ink-2);resize:vertical}
.iomsg{font-size:12px;line-height:1.7;color:#4a5f3a;margin:10px 0 0}
.iomsg.bad{color:var(--blood)}

/* 随身战利品 */
.lootbar{display:flex;align-items:center;gap:10px;padding:9px 14px;margin-bottom:14px;font-size:12px;color:#4a5f3a;
  background:#f1f6ec;border:1px solid #d4e0c6;border-left:3px solid #6d8a52;border-radius:6px;flex-wrap:wrap}
.lootbar .lname{font-weight:500;letter-spacing:.04em}
.lootbar .litems{flex:1;min-width:80px;line-height:1.6}
.lootbar .lrisk{font-size:11px;color:#8a9a78;letter-spacing:.02em}
.fx.lost{text-decoration:line-through;opacity:.55}
@media (max-width:640px){
  .lootbar{padding:8px 12px;font-size:11.5px;gap:7px}
  .lootbar .lrisk{font-size:10.5px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ============================================================
   中土远征 v0.2
   三区连续远征 · 难度阶梯 · 装备军械库 · 天赋树 · 事件链
   ============================================================ */

/* ---------- 0. 工具 ---------- */
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function ri(rnd,n){ return Math.floor(rnd()*n); }
const $ = id=>document.getElementById(id);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 1. 常量 ---------- */
const ATTRS = { valor:'勇武', cunning:'机敏', lore:'学识', spirit:'心志' };

const TIERS = [
  { id:1, name:'初次远行', note:'标准规则，无额外修正。', mods:{} },
  { id:2, name:'长夜', note:'所有检定 DC +1。', mods:{ dc:1 } },
  { id:3, name:'补给紧张', note:'补给上限 −1。', mods:{ supply:-1 } },
  { id:4, name:'阴影紧随', note:'每层一次追踪检定（失败 −2），且路耗 +1。', mods:{ hunt:1, supplyDrain:1 } },
  { id:5, name:'无援', note:'追踪检定照旧，补给上限再 −1。', mods:{ hunt:1, supply:-1 } },
  { id:6, name:'终局', note:'无法撤退；所有伤害 +1；抵达终点需通过 DC 16 检定。', mods:{ noRetreat:1, finalDC:16, dmg:1 } }
];

/* 阴影：只增不减。唯一的下降途径是特定地点的净化。 */
const SHADOW_STAGES = [
  { at:0, name:'未染',   line:'你还是你自己。' },
  { at:1, name:'微暗',   line:'夜里你睡得不太踏实。' },
  { at:2, name:'沉重',   line:'你开始觉得冷，即使火就在旁边。' },
  { at:4, name:'被注视', line:'有时候你会回头。后面没有人。' },
  { at:6, name:'模糊',   line:'你已经不太记得出发时的理由。' },
  { at:7, name:'将熄',   line:'镜子里的脸，你认了一会儿才认出来。' },
  { at:8, name:'它的',   line:'你不再需要理由了。' }
];
const SHADOW_MAX = 8;

        ok:{ text:'他说起三十年前的事，说了很久。临走时，他把鱼篓里最大的一条给了你。', fx:{supply:2,flag:{warned:true}} },
        no:{ text:'他摇摇头，不再说话。你在旁边站了一会儿，只好走了。', fx:{} } },
      { label:'谢过他，继续赶路', fx:{renown:1}, ok:{ text:'他冲你点点头。你走出很远，回头时他还在那里，一动不动。' } }
    ] },

  { id:'shire_deadtree', region:'shire', type:'encounter', weight:9, title:'枯树',
    text:'一棵枯树孤零零立在田埂上，树枝上挂着东西，被风吹得打转。走近了才看清，是几块布条，还有一只鞋。',
    options:[
      { label:'把布条解下来看看', check:{attr:'lore',dc:12},
        ok:{ text:'布条上有记号，是某种警告，画的是一只手。你把布条收起来，也许有人认得。', fx:{renown:2,flag:{sign:true}} },
        no:{ text:'你伸手的瞬间，树上的东西掉了下来。是一只死乌鸦，脖子被拧断了。', fx:{resolve:-1} } },
      { label:'离远一点，绕过去', fx:{}, ok:{ text:'你从田的另一头绕过去。风还在吹那些布条。' } }
    ] },

  { id:'shire_bridge', region:'shire', type:'story', weight:9, title:'小石桥',
    text:'桥很窄，只够一个人过。桥中央坐着一个孩子，脚垂在栏杆外，看见你就跳下来，让到一边。',
    options:[
      { label:'问他在等谁', check:{attr:'spirit',dc:11},
        ok:{ text:'他说等他哥，去布理买盐，走了三天。你陪他等了一会儿。他给了你一块糖。', fx:{resolve:1,renown:1} },
        no:{ text:'他摇头不说话。你走过去之后，回头看他已经在桥上坐回原样。', fx:{} } },
      { label:'直接走过去', fx:{}, ok:{ text:'你从他身边侧身过去。他一句话也没说。' } }
    ] },

  { id:'shire_letters', region:'shire', type:'story', weight:8, title:'邮差',
    text:'一个胖邮差骑着矮马，驮着两个鼓鼓的袋子。他看见你，勒住马：往东？帮我捎一封信，我给你点东西。',
    options:[
      { label:'接下来', check:{attr:'spirit',dc:10},
        ok:{ text:'信是写给布理一个铁匠的。你翻过来，信封上写着收信人的名字。他给了你一小瓶油。', fx:{supply:1,renown:1,token:['smith_name','courier_letter']},chain:'bree_smith' },
        no:{ text:'他打量你半天，把信收了回去。', fx:{} } },
      { label:'拒绝，赶路要紧', fx:{}, ok:{ text:'他耸耸肩，赶着马走了。' } }
    ] },

  { id:'shire_dog', region:'shire', type:'encounter', weight:9, title:'猎犬',
    text:'三只狗从坡上冲下来，围着你打转，不叫，只是低吼。它们没有项圈，瘦得能看见肋骨。',
    options:[
      { label:'站住不动，让它们闻', check:{attr:'spirit',dc:12},
        ok:{ text:'最前面那只闻了很久，然后退开了。三只狗一起走了，没回头。', fx:{resolve:1,renown:1} },
        no:{ text:'它们同时动了。你被扑倒，手臂上多了一道口子。', fx:{hp:-3} } },
      { label:'捡石头把它们赶开', check:{attr:'valor',dc:11},
        ok:{ text:'你扔得很准。它们散了，跑出几步又回头看。', fx:{renown:1} },
        no:{ text:'它们不怕石头。你退了一段路才摆脱。', fx:{hp:-2,supply:-1} } }
    ] },

  { id:'shire_stile', region:'shire', type:'story', weight:8, title:'木梯',
    text:'一道矮墙，墙边架着木梯。梯子有年头了，踩上去会响。墙那头是一片没割的草地，草比人高。',
    options:[
      { label:'翻过去，走草地', check:{attr:'cunning',dc:11},
        ok:{ text:'草里有一条踩出来的窄道。你顺着它走，省了半天的路。', fx:{supply:1} },
        no:{ text:'你在草里迷了方向，转了很久才找到路。', fx:{supply:-2} } },
      { label:'沿墙走，绕过去', fx:{supply:-1}, ok:{ text:'墙很长。你走了很久，但路是直的。' } }
    ] },

  { id:'shire_smoke', region:'shire', type:'story', weight:8, title:'远处的烟',
    text:'西南边升起一股烟，很细，很直，不像烧柴，也不像烧炭。风一吹，它就偏，风一停，它又直了。',
    options:[
      { label:'朝烟走过去', check:{attr:'valor',dc:12},
        ok:{ text:'是一处被烧过的营地，火已经灭了，灰还是热的。地上有马蹄印，很深。', fx:{renown:2,flag:{trail:true}} },
        no:{ text:'你走了很久，烟一直在前面，怎么走也到不了。', fx:{supply:-2,resolve:-1} } },
      { label:'记下方向，绕着走', fx:{renown:1}, ok:{ text:'你把方向记在心里。也许之后用得着。' } }
    ] },

  { id:'shire_child', region:'shire', type:'story', weight:8, title:'树下的孩子',
    text:'树下坐着个孩子，抱着膝盖。你走近了，他才抬头，说他找不到回家的路了。他指的方向，和你正要去的方向相反。',
    options:[
      { label:'带他回去', check:{attr:'spirit',dc:12},
        ok:{ text:'走了半个时辰，看见了炊烟。他母亲冲出来抱住他，然后塞给你一整条面包。', fx:{supply:2,renown:2} },
        no:{ text:'走了很久也没看见人家。孩子忽然说他记错了，然后自己跑掉了。', fx:{supply:-2} } },
      { label:'告诉他方向，自己走', fx:{}, ok:{ text:'你指了路。他点点头，但没动。你走出很远，他还在树下。' } }
    ] },

  { id:'shire_well', region:'shire', type:'treasure', weight:8, title:'旧井',
    text:'井已经不用了，井口盖着木板。木板朽了一半，缝里能看见下面有水光。井沿上放着一只木桶，桶绳还是新的。',
    options:[
      { label:'把桶放下去', check:{attr:'cunning',dc:12},
        ok:{ text:'桶碰到底，晃了几下。提上来的时候，里面除了水，还有一枚银戒指。', fx:{item:'ring'} },
        no:{ text:'绳子磨断了。桶掉下去，声音很久才传上来。', fx:{resolve:-1} } },
      { label:'不碰，井这种东西有主', fx:{resolve:1}, ok:{ text:'你绕开井口。走远之后，觉得这样更好。' } }
    ] },

  { id:'shire_cart', region:'shire', type:'story', weight:9, title:'翻倒的车',
    text:'一辆手推车侧翻在路沟里，轮子还在转。车上的萝卜撒了一地。车夫不在。',
    options:[
      { label:'把车扶起来，帮着收东西', check:{attr:'valor',dc:11},
        ok:{ text:'车夫从坡后跑过来，满头是汗。他硬塞给你一兜萝卜和两枚铜板。', fx:{supply:2,renown:1} },
        no:{ text:'车太重，你扶到一半就滑了。车夫赶来时，你正坐在地上喘气。', fx:{hp:-1,supply:1} } },
      { label:'拿走几个萝卜，继续走', fx:{supply:1,shadow:1}, ok:{ text:'你揣了几个。走远之后，听见后面有人在骂。' } }
    ] },

  { id:'shire_bees', region:'shire', type:'encounter', weight:8, title:'蜂箱',
    text:'路边的蜂箱倒了三个，蜜蜂在黑压压地飞，声音很大。养蜂人躺在地上，一动不动。',
    options:[
      { label:'先把人拖出来', check:{attr:'valor',dc:13},
        ok:{ text:'他还有气。你把他拖到远处，他醒过来，第一句话是问蜂箱。他给了你一小罐蜜。', fx:{hp:1,renown:2,supply:1} },
        no:{ text:'你被蜇了十几下。人是拖出来了，但你的脸肿了半边。', fx:{hp:-3,renown:1} } },
      { label:'用烟熏开蜂群再过去', check:{attr:'lore',dc:12},
        ok:{ text:'你点了把湿草，烟一起来，蜂群就散了。养蜂人坐起来看着你，说了声谢谢。', fx:{renown:1,supply:1} },
        no:{ text:'烟不够。你退回去的时候，已经被蜇了好几下。', fx:{hp:-2} } }
    ] },

  { id:'shire_lantern', region:'shire', type:'encounter', weight:8, title:'提灯的人',
    text:'天快黑了，路上走来一个人，提着一盏灯。灯光不亮，只照得亮他自己的脚。他走得很慢，走近了你才发现他没有影子。',
    options:[
      { label:'跟他打招呼', check:{attr:'spirit',dc:13},
        ok:{ text:'他停下，抬起头。灯晃了一下。他说：往东，别走古道。然后就走了。', fx:{flag:{warned:true},renown:2} },
        no:{ text:'他没有停，也没有抬头。你回头时，路上什么也没有，连灯都没有。', fx:{resolve:-2} } },
      { label:'让到路边，等他过去', check:{attr:'cunning',dc:11},
        ok:{ text:'你贴着篱笆站住。他过去了，风带过来一股湿土的味道。', fx:{resolve:1} },
        no:{ text:'他经过你身边时，灯忽然灭了一下。那一瞬间你什么也看不见。', fx:{resolve:-1,hp:-1} } }
    ] },

  { id:'shire_harvest', region:'shire', type:'camp', weight:9, title:'收割',
    text:'田里有人收割，十几个人一起，边干边唱。看见你，他们停下来，招呼你一起吃点东西。',
    options:[
      { label:'坐下来吃一顿', fx:{hp:2,supply:2,resolve:1}, ok:{ text:'麦酒很淡，面包很新鲜。有人递给你一把镰刀，说下次路过再来。' } },
      { label:'帮忙干一会儿活', check:{attr:'valor',dc:11},
        ok:{ text:'你割了一下午。手上起了泡，但晚饭吃得很香，他们还塞给你一袋麦子。', fx:{hp:1,supply:3,renown:1} },
        no:{ text:'你割伤了小腿。他们让你坐着，还是给了你吃的。', fx:{hp:-1,supply:2} } }
    ] },

  { id:'shire_fence', region:'shire', type:'treasure', weight:8, title:'修篱笆',
    text:'篱笆塌了一小段，塌口很新。旁边地上放着一把锤子和一盒钉子，像是干到一半走了。',
    options:[
      { label:'把这段篱笆修好', check:{attr:'valor',dc:10},
        ok:{ text:'你钉得很结实。锤子和剩下的钉子，你收下了。', fx:{renown:2,material:2} },
        no:{ text:'钉子钉歪了，你锤到了手指。', fx:{hp:-1,material:1} } },
      { label:'拿走工具', fx:{material:2}, ok:{ text:'锤子还能用，钉子也是。你收下了。' } }
    ] },

  /* ==================== 通用 ==================== */
  { id:'any_rain', region:'any', type:'camp', weight:11, title:'雨夜',
    text:'雨从午后就没停过。你在石壁下找到一处凹洞，勉强能挡住风。柴是湿的，火起了三次才着。',
    options:[
      { label:'把衣服烤干，好好睡一觉', fx:{hp:2,supply:-1}, ok:{ text:'火一直烧到后半夜。你醒来时雨停了，骨头也不那么沉了。' } },
      { label:'轮流守夜，留一分警觉', fx:{resolve:1,supply:-1}, ok:{ text:'你在黑暗里坐了很久。没出事，但天亮时你比睡前更清醒。' } }
    ] },

  { id:'any_bridge', region:'any', type:'encounter', weight:9, title:'断桥',
    text:'桥断了。断口还算新鲜，木茬是白的，像是这几天才塌的。对岸就是你要去的方向，绕路要多走半天。',
    options:[
      { label:'攀着残存的桥架爬过去', check:{attr:'valor',dc:13},
        ok:{ text:'木头在脚下响了一声，没有断。你落到对岸，手心全是汗。', fx:{supply:-1} },
        no:{ text:'一根横木翻了。你摔进浅滩，膝盖磕在石头上，水冷得像刀。', fx:{hp:-3,supply:-1} } },
      { label:'沿岸找浅处涉水', check:{attr:'cunning',dc:12},
        ok:{ text:'半里外有片卵石滩，水只到膝盖。你过得不算体面，但浑身干着。', fx:{supply:-1} },
        no:{ text:'河床比看上去深。你丢了一包东西，才爬上岸。', fx:{hp:-1,supply:-2} } },
      { label:'在桥头等到明天', fx:{supply:-2,resolve:1}, ok:{ text:'夜里又下了雨。你吃了两顿干粮，想清楚了一些事。' } }
    ] },

  { id:'any_stone', region:'any', type:'story', weight:9, title:'旧路碑',
    text:'路边立着一块半埋的石头，上面刻着字，被苔藓吃掉大半。你认得几个：这里曾是某个王国的边界。',
    options:[
      { label:'蹲下来，把苔藓刮干净', check:{attr:'lore',dc:12},
        ok:{ text:'你读出了最后一行：往东三里，有水。碑脚的石缝里还塞着一小包盐。', fx:{renown:1,supply:1} },
        no:{ text:'你刮了很久，只认出两个残缺的地名。手指被石屑磨破了。', fx:{hp:-1} } },
      { label:'没工夫，继续走', fx:{}, ok:{ text:'你从碑边走过去。它会在那里再站几百年。' } }
    ] },

  { id:'any_cache', region:'any', type:'treasure', weight:9, title:'石缝里的东西',
    text:'一处塌了一半的石墙，缝里塞着布包。布已经烂了，里面的东西还在。',
    options:[
      { label:'小心地把它掏出来', check:{attr:'cunning',dc:12},
        ok:{ text:'是一把短匕，鞘上还留着银线。', fx:{item:'dagger'} },
        no:{ text:'石墙在你手下塌了一角。东西还在，但你的手臂被划开一道口子。', fx:{hp:-2,item:'dagger'} } },
      { label:'不碰。这种地方的东西有主', fx:{resolve:1}, ok:{ text:'你绕开了。走远之后，你觉得这样更好。' } }
    ] },

  { id:'any_stranger', region:'any', type:'story', weight:9, title:'同路人',
    text:'前面有个人，走得不快不慢。你跟上他，他也不回头。走了一段，他才开口：一个人走，容易走错。',
    options:[
      { label:'跟他搭话，一起走一段', check:{attr:'spirit',dc:12},
        ok:{ text:'他说他去过很多地方，说的都不像假话。分别时他指了一条近路。', fx:{supply:1,renown:1,resolve:1} },
        no:{ text:'他说话很少，你也就不再问。天黑前他拐进了一条岔路。', fx:{} } },
      { label:'放慢脚步，让他先走', fx:{}, ok:{ text:'你落在后面。他的背影越来越小，最后消失在路的弯处。' } }
    ] },

  { id:'any_fire', region:'any', type:'camp', weight:9, title:'借火',
    text:'路边有个现成的火堆，火还在烧，人不在。火堆旁整整齐齐地摆着三块石头。',
    options:[
      { label:'坐下来烤火，等等看', check:{attr:'cunning',dc:12},
        ok:{ text:'等了一刻钟，没人回来。火很暖，你还找到半块没吃完的饼。', fx:{hp:2,supply:1} },
        no:{ text:'火堆忽然塌了，火星溅出来。你跳起来，看见坡上有个人影正看着你。', fx:{hp:-1,resolve:-1} } },
      { label:'不坐了，继续走', fx:{}, ok:{ text:'你绕过火堆。走了一段，回头看，火还在烧。' } }
    ] },

  { id:'any_forage', region:'any', type:'treasure', weight:8, title:'采集',
    text:'这一带的灌木上结着深色的小果子，看起来能吃。地上还有一些能用的藤条。',
    options:[
      { label:'采一些，试着吃', check:{attr:'lore',dc:11},
        ok:{ text:'酸，但没毒。你采了满满一兜，还编了一根结实的绳子。', fx:{supply:2,material:1} },
        no:{ text:'吃了几个，胃里开始翻。你吐了一路。', fx:{hp:-2,supply:1} } },
      { label:'只拿藤条，不碰果子', fx:{material:2}, ok:{ text:'藤条很有用。果子就让它们挂着。' } }
    ] },

  { id:'any_fog', region:'any', type:'encounter', weight:9, title:'起雾',
    text:'雾来得很快，前面十步就看不见了。你听见雾里有脚步声，和你的步子一样快。',
    options:[
      { label:'停下来，听清楚', check:{attr:'cunning',dc:13},
        ok:{ text:'脚步声也停了。过了一会儿，它又响起来，往另一个方向去了。', fx:{resolve:1,renown:1} },
        no:{ text:'你听不出来。脚步忽然近了，然后什么也没有了。你的手心全是汗。', fx:{resolve:-2} } },
      { label:'加快脚步，尽快走出去', check:{attr:'valor',dc:12},
        ok:{ text:'你走了很久，雾终于薄了。回头看，什么也没有跟上来。', fx:{supply:-1} },
        no:{ text:'你走错了方向，绕了很久才回到路上。', fx:{supply:-2,hp:-1} } }
    ] },

  { id:'any_trade', region:'any', type:'story', weight:8, title:'以物易物',
    text:'一个背着大包的人迎面走来，看见你就停下：换点什么？他把包打开，里面什么都有。',
    options:[
      { label:'用补给换一件东西', fx:{supply:-2,item:'lambas'}, ok:{ text:'他用一块兰巴斯换了你的干粮，还多给了一小撮盐。', chain:null } },
      { label:'不换，只是聊几句', check:{attr:'spirit',dc:11},
        ok:{ text:'他讲了不少路上的事。临走时送了你一根绳子。', fx:{material:1,renown:1} },
        no:{ text:'他见你不买，收起包就走了。', fx:{} } }
    ] },

  { id:'any_night', region:'any', type:'camp', weight:8, title:'夜宿',
    text:'天黑了，前面没有村子。你在一棵大树下清出一块平地，捡了些干柴。',
    options:[
      { label:'生火，睡到天亮', fx:{hp:3,supply:-1}, ok:{ text:'火很小，但一直没灭。你睡得不深，但足够了。' } },
      { label:'不生火，靠着树坐一夜', check:{attr:'cunning',dc:12},
        ok:{ text:'夜里很冷，但你看见了三次流星。天亮时你意外地清醒。', fx:{resolve:2,supply:-1} },
        no:{ text:'你睡着了，醒来时天已经亮，背包被翻开过，少了点东西。', fx:{supply:-2,hp:-1} } }
    ] }
,

  /* ==================== 布理 ==================== */
  { id:'bree_pony', region:'bree', type:'story', weight:13, title:'跃马客栈',
    text:'门一推开，热气裹着麦酒味涌出来。炉边坐着几个本地人，声音压得很低。角落里有个兜帽人，面前摆着一杯没动过的酒，像是在等谁。',
    options:[
      { label:'走过去，问他在等什么', check:{attr:'spirit',dc:13},
        ok:{ text:'他抬起头。眼睛很亮，不像在等人，像在确认什么。他说：你走的路不对。然后告诉了你一条更安全的路。', fx:{flag:{strider:true},renown:3,supply:1},chain:'bree_strider' },
        no:{ text:'他没有回答，站起来走了。门口的伙计看你的眼神变了。', fx:{resolve:-1,flag:{marked:true}} } },
      { label:'找个靠墙的位置，先听', check:{attr:'cunning',dc:12},
        ok:{ text:'你听了半个晚上。有人说南边大路上有黑马，有人说那只是醉话。', fx:{supply:1,flag:{rumor:true}} },
        no:{ text:'你听了一晚上，只听见自己的肚子在叫。', fx:{supply:-1} } },
      { label:'花钱要一间房，睡到天亮', fx:{supply:-2,hp:4}, ok:{ text:'床板很硬，隔壁有人打呼。但你睡着了，而且没做梦。' } }
    ] },

  { id:'bree_wagon', region:'bree', type:'story', weight:11, title:'大道上的货车',
    text:'一辆货车歪在路边，轮子断了。车夫蹲在旁边，手里拿着锤子，看样子已经试了很久。车上盖着油布。',
    options:[
      { label:'帮他修轮子', check:{attr:'valor',dc:12},
        ok:{ text:'你们把轮子抬回轴上，用绳子临时固定。他非要给你钱，你只收了一点干粮。', fx:{supply:2,renown:2} },
        no:{ text:'轮辐在你手里断了。他叹了口气，说算了。你的手也划破了。', fx:{hp:-1} } },
      { label:'问他车上装的是什么', check:{attr:'cunning',dc:13},
        ok:{ text:'他犹豫了一下，掀开一角：是盐。这个年头，盐比刀值钱。他给了你一小袋。', fx:{supply:2,material:1} },
        no:{ text:'他把油布按住了，说没什么。你注意到他另一只手一直放在座位下面。', fx:{resolve:-1} } },
      { label:'不耽搁，从车边走过去', fx:{}, ok:{ text:'你走过那辆车。身后传来锤子敲击的声音，一下，一下。' } }
    ] },

  { id:'bree_barrow', region:'bree', type:'encounter', weight:11, title:'古冢岗的雾',
    text:'雾从坟包之间升起来，贴着地面。你脚下的草是干的，但雾里有水声。雾深处立着几块石头，排成一个圈。',
    options:[
      { label:'走进石圈，看看中间有什么', check:{attr:'lore',dc:14},
        ok:{ text:'中间是一块平平的石头，上面放着一把剑。你拿起它的时候，雾退了一步。', fx:{item:'sword',renown:3} },
        no:{ text:'你走进石圈，雾就合上了。你在里面转了不知多久，出来时天已经黑了，手上多了一道冻伤。', fx:{hp:-4,resolve:-2,supply:-2} } },
      { label:'沿着雾的边缘绕过去', check:{attr:'cunning',dc:13},
        ok:{ text:'你贴着草地走，一步也没踩进雾里。回头看时，石圈还在那里，雾没有动。', fx:{supply:-1} },
        no:{ text:'雾比你想的宽。你在里面走了很久，出来时方向已经偏了。', fx:{supply:-2,resolve:-1} } }
    ] },

  { id:'bree_watch', region:'bree', type:'story', weight:10, title:'布雷兰的守夜人',
    text:'村口立着两个人，手里拿着长矛，矛尖对着你。其中一个开口：这个时辰，从大路来的人，都要说清楚来意。',
    options:[
      { label:'照实说你要去哪里', check:{attr:'spirit',dc:12},
        ok:{ text:'他们对视了一眼，让开了路。其中一个低声说：走北边那条，南边今天不干净。', fx:{flag:{warned:true},renown:1} },
        no:{ text:'他们不信。你被盘问了很久，最后虽然放行，但天已经黑了。', fx:{supply:-1,resolve:-1} } },
      { label:'编一个做买卖的身份', check:{attr:'cunning',dc:14},
        ok:{ text:'你说得很顺，连货价都报得出来。他们挥挥手放你过去。', fx:{renown:1,supply:1} },
        no:{ text:'其中一个人盯着你的靴子看了很久。最后他们还是放了你，但一直看着你走进村子。', fx:{flag:{marked:true}} } },
      { label:'不进城，从外围绕', fx:{supply:-1}, ok:{ text:'你绕了很远。夜里冷，但省了麻烦。' } }
    ] },

  { id:'bree_fire', region:'bree', type:'camp', weight:10, title:'荒野的篝火',
    text:'你在一处背风的洼地里生起火。火光只能照到三步远，再往外就是黑。远处有东西在叫，听不出是什么。',
    options:[
      { label:'把火烧旺，好好休息', fx:{hp:3,supply:-1,resolve:1}, ok:{ text:'你睡得很沉。醒来时火已经灭了，但身上是暖的。' } },
      { label:'灭掉火，摸黑赶一段路', check:{attr:'cunning',dc:13},
        ok:{ text:'月亮出来了。你借着光走了很远，比白天还快。', fx:{supply:1,resolve:1} },
        no:{ text:'你在黑暗里崴了脚，只能原地坐下，等天亮。', fx:{hp:-2,supply:-1} } }
    ] },

  { id:'bree_bridge', region:'bree', type:'story', weight:9, title:'石桥的守桥人',
    text:'桥头坐着一个瘦高的人，脚边放着一根木杆。过桥要交钱，他说，一个人两个铜板，或者一件有用的东西。',
    options:[
      { label:'付钱过桥', fx:{supply:-1}, ok:{ text:'他收了钱，把木杆横在一边。桥面很窄，但结实。' } },
      { label:'跟他讲价', check:{attr:'spirit',dc:12},
        ok:{ text:'他看了你一会儿，笑了：行吧，你走过去就是了。', fx:{renown:1} },
        no:{ text:'他不为所动。你最后还是付了，而且多付了一个铜板。', fx:{supply:-2} } },
      { label:'找别的地方过河', check:{attr:'cunning',dc:14},
        ok:{ text:'上游半里有片浅滩。你过去了，没弄湿多少。', fx:{} },
        no:{ text:'河比看上去宽。你游到一半就没力气了，爬上岸时丢了半包东西。', fx:{hp:-2,supply:-2} } }
    ] },

  { id:'bree_wolves', region:'bree', type:'encounter', weight:11, title:'狼群',
    text:'它们不叫。你先是看见草在动，然后是眼睛，三双，四双。它们散开，把你围在中间，不急着上前。',
    options:[
      { label:'点火把，逼退它们', check:{attr:'lore',dc:12},
        ok:{ text:'火起来的瞬间，最前面那只退了。它们跟着退，最后消失在草里。', fx:{supply:-1} },
        no:{ text:'火把没点着。四只一起动了。你抡着背包冲出去，被咬到了小腿。', fx:{hp:-4} } },
      { label:'举起武器，正面冲最弱的那只', check:{attr:'valor',dc:14},
        ok:{ text:'你冲过去，它退了。狼群不追站着的东西。你站着，它们就走了。', fx:{renown:2} },
        no:{ text:'你选错了目标。它比你快。', fx:{hp:-5} } },
      { label:'慢慢后退，不转身', check:{attr:'cunning',dc:13},
        ok:{ text:'你退了很远，直到看不见眼睛。腿一直在抖。', fx:{supply:-1,resolve:-1} },
        no:{ text:'你退了十几步，踩到一根树枝。', fx:{hp:-3,resolve:-1} } }
    ] },

  { id:'bree_camp', region:'bree', type:'treasure', weight:9, title:'被遗弃的营地',
    text:'营地空了，火堆还是温的。地上有拖拽的痕迹，从火堆一直延伸到林子边上。三个铺盖，只有两个背包还在。',
    options:[
      { label:'先看看痕迹通向哪里', check:{attr:'lore',dc:13},
        ok:{ text:'痕迹到林子边就断了，但你在附近找到一处新翻的土。里面是个铁盒，装着一件锁甲。', fx:{item:'mail'} },
        no:{ text:'你顺着痕迹走进林子，什么也没找到，回来时营地里的东西少了一半。', fx:{supply:-2} } },
      { label:'不管痕迹，先拿能拿的', check:{attr:'cunning',dc:11},
        ok:{ text:'你翻出一些干粮和一卷绷带。痕迹还在那里，你没敢多看。', fx:{supply:3,hp:1} },
        no:{ text:'你翻包的时候，听见林子那边有动静。你抓了两样东西就跑。', fx:{supply:1,hp:-1} } }
    ] },

  { id:'bree_merchant', region:'bree', type:'story', weight:10, title:'南来的货商',
    text:'一个矮胖的货商牵着两匹骡子，骡背上捆满了包。他看见你，先笑了：走这条路的，不是逃命就是找死。你要哪个？',
    options:[
      { label:'跟他换点东西', fx:{supply:-1,item:'lambas'}, ok:{ text:'他用一块兰巴斯换了你的干粮。临走时说：往前走，别停。', chain:'wild_merchant_dead' } },
      { label:'问他前面有什么', check:{attr:'spirit',dc:11},
        ok:{ text:'他收了笑，说了几句实话。你听完，把路线改了改。', fx:{renown:1,resolve:1} },
        no:{ text:'他打了个哈哈，赶着骡子走了。', fx:{} } },
      { label:'不搭理，各走各的', fx:{}, ok:{ text:'你们在窄路上错身而过。他身上的味道很重。' } }
    ] },

  { id:'bree_breath', region:'bree', type:'encounter', weight:9, title:'吸气声',
    text:'风停了。你听见很轻的一声吸气，就在你身后，不超过十步。你没有回头。第二声更近。',
    options:[
      { label:'扑向路边的石头后面', check:{attr:'cunning',dc:15},
        ok:{ text:'你滚到石头后面，屏住呼吸。脚步声停了一下，然后走远了。你等了很久才敢动。', fx:{renown:3},chain:'wild_shadow' },
        no:{ text:'你动得太慢。一只手抓住了你的肩，很冷，隔着衣服都冷。你挣脱了，但那只手留下的地方一直没暖过来。', fx:{hp:-5,resolve:-2},chain:'wild_shadow' } },
      { label:'拔剑，转身', check:{attr:'valor',dc:15},
        ok:{ text:'你转身的速度比它预想的快。剑挥空了，但它退了。它退了，这就够了。', fx:{renown:4,hp:-1} },
        no:{ text:'你看见的比你想看的多。有什么击中你的胸口，你倒在地上，很久之后才敢睁开眼。', fx:{hp:-6,resolve:-2} } },
      { label:'不动，假装没听见', check:{attr:'spirit',dc:14},
        ok:{ text:'你继续走，步子没变。吸气声跟了你一段，然后消失了。', fx:{resolve:1,renown:1} },
        no:{ text:'你走了几步就忍不住跑了。跑起来的东西，才是猎物。', fx:{hp:-4,resolve:-2} } }
    ] },

  { id:'bree_smith', region:'bree', type:'story', weight:8, title:'铁匠',
    text:'铁匠铺的门开着，炉火还亮。铁匠背对着你，正在敲一块烧红的铁。他头也不回：东西放桌上，钱也放桌上。',
    options:[
      { label:'把信交给他', need:{token:'courier_letter'}, consume:'token', check:{attr:'spirit',dc:10},
        ok:{ text:'他放下锤子，看完信，沉默了很久。然后从架子底下摸出一副护腕给你。', fx:{renown:2,material:2} },
        no:{ text:'他看完信，什么也没说，把信折好放进围裙。你站了一会儿，只好走了。', fx:{} } },
      { label:'请他修一下你的东西', fx:{supply:-1,material:1}, ok:{ text:'他看了一眼，敲了两下，说行了。收了你一半的钱。' } },
      { label:'只是看看，不打扰', fx:{}, ok:{ text:'你站在门口看了一会儿。锤声很稳，一下是一下。' } }
    ] },

  { id:'bree_gate', region:'bree', type:'story', weight:8, title:'城门',
    text:'布理的城门天黑就关。你到的时候，门已经关了一半。守门人正把最后一块门板往里推。',
    options:[
      { label:'喊住他，说好话', check:{attr:'spirit',dc:12},
        ok:{ text:'他叹了口气，把门板挪开一条缝。你侧身挤了进去。', fx:{supply:1} },
        no:{ text:'他摇头，说规矩就是规矩。你只能在城外过夜。', fx:{hp:-1,resolve:-1} } },
      { label:'塞点钱', fx:{supply:-2}, ok:{ text:'他收了钱，什么也没问。门缝刚好够一个人。' } },
      { label:'不进城，城外过夜', fx:{hp:-1,supply:-1}, ok:{ text:'你在一棵树下坐下。城墙上的火把烧了一夜。' } }
    ] },

  { id:'bree_beggar', region:'bree', type:'story', weight:8, title:'乞丐',
    text:'墙角坐着一个人，裹着破毯子。他不伸手，也不说话，只是看着你走过。他的眼睛很清。',
    options:[
      { label:'分他一点吃的', check:{attr:'spirit',dc:11},
        ok:{ text:'他接过去，吃得很慢。吃完他说：南边第三个路口，别往左。', fx:{renown:2,resolve:1,flag:{warned:true}} },
        no:{ text:'他接了，但没吃，也没说话。你走开的时候，他还捧在手里。', fx:{supply:-1} } },
      { label:'给他一个铜板', fx:{supply:-1,renown:1}, ok:{ text:'他把铜板收进毯子里，冲你点了下头。' } },
      { label:'走过去', fx:{shadow:1}, ok:{ text:'你从他面前走过。他没有抬头。' } }
    ] },

  { id:'bree_dice', region:'bree', type:'story', weight:8, title:'掷骰子',
    text:'后巷里有几个人围着木箱掷骰子。看见你，其中一个让出半个位置：来一把？赌注随你。',
    options:[
      { label:'来一把，赌点补给', check:{attr:'cunning',dc:13},
        ok:{ text:'你连赢两把。他们笑着骂了几句，把钱推给你。', fx:{supply:2,renown:1,shadow:1} },
        no:{ text:'你输了。他们没为难你，只是把东西收走了。', fx:{supply:-2} } },
      { label:'看着，不下注', check:{attr:'lore',dc:11},
        ok:{ text:'你看出了骰子的门道，也看出了谁在出千。你没说，只是记住了。', fx:{renown:1,resolve:1} },
        no:{ text:'你看不懂。站了一会儿就走了。', fx:{} } }
    ] },

  { id:'bree_rumor', region:'bree', type:'camp', weight:8, title:'酒馆后间',
    text:'酒馆后间比外头安静。几个人在低声说话，看见你进来，话头停了一下，又接上了。',
    options:[
      { label:'买一轮酒，坐下听', fx:{supply:-1,hp:1}, ok:{ text:'酒过三巡，话就多了。你听到了一些不该忘的事。', chain:'bree_strider' } },
      { label:'不插话，只喝酒', fx:{hp:1,resolve:1}, ok:{ text:'你喝完就走。没人注意你，这正是你想要的。' } }
    ] },

  { id:'bree_stable', region:'bree', type:'treasure', weight:8, title:'马厩',
    text:'马厩里只剩一匹老马，站在最里面的隔间。鞍子还挂着，落了一层灰。',
    options:[
      { label:'看看鞍袋里有什么', check:{attr:'cunning',dc:12},
        ok:{ text:'一副旧皮护腕，还有半袋燕麦。', fx:{item:'leather',supply:2} },
        no:{ text:'你刚伸手，老马就踢了一脚。鞍袋是空的。', fx:{hp:-2} } },
      { label:'给马添点草，走人', fx:{resolve:1}, ok:{ text:'老马低头吃草。你摸了摸它的脖子。' } }
    ] },

  { id:'bree_night', region:'bree', type:'encounter', weight:9, title:'夜里敲门',
    text:'半夜有人敲门。三下，停一停，又三下。你住的屋子在二楼，门外是走廊，走廊尽头是窗。',
    options:[
      { label:'开门', check:{attr:'valor',dc:13},
        ok:{ text:'门外站着一个孩子，浑身湿透，说他父亲还没回来。你带他下楼，找到了守夜人。', fx:{renown:3,resolve:1} },
        no:{ text:'门外没有人。走廊尽头的窗开着，风把窗帘吹得很高。', fx:{resolve:-2} } },
      { label:'从窗子看下去', check:{attr:'cunning',dc:12},
        ok:{ text:'街上没有人。但对面屋檐下有个影子，一直没动。你看了很久，它也没动。', fx:{renown:1,flag:{watched:true}} },
        no:{ text:'你探头的时候，敲门声停了。', fx:{resolve:-1} } },
      { label:'不理，把门闩上', fx:{resolve:-1}, ok:{ text:'敲门声持续了很久，然后停了。你一夜没睡。' } }
    ] },

  { id:'bree_debt', region:'bree', type:'story', weight:8, title:'欠债的人',
    text:'巷子里两个人在吵架。一个说下个月一定还，一个说这话你说了三次了。旁边站着一个拿棍子的。',
    options:[
      { label:'上去劝架', check:{attr:'spirit',dc:13},
        ok:{ text:'你把话说圆了，双方各退一步。欠债的人塞给你一枚铜板，说了声谢。', fx:{renown:2,supply:1} },
        no:{ text:'拿棍子的那个让你少管闲事。你退开了。', fx:{resolve:-1} } },
      { label:'绕开走', fx:{}, ok:{ text:'你从巷口退出去，绕了一条街。吵架声还在后面。' } }
    ] },

  { id:'bree_map', region:'bree', type:'story', weight:8, title:'卖地图的人',
    text:'一个人蹲在路边，面前铺着一张手绘的地图。他指着东边：这条路，一般人不知道。',
    options:[
      { label:'买下来', fx:{supply:-1}, ok:{ text:'地图画得粗糙，但路线是真的。后半程省了不少力气。', chain:null } },
      { label:'问他从哪来的图', check:{attr:'lore',dc:12},
        ok:{ text:'他说是跟一个游侠学的。你跟他聊了很久，记住了几处标记。', fx:{renown:1,flag:{map:true}} },
        no:{ text:'他收起图，说买就买，不买别问。', fx:{} } }
    ] },

  { id:'bree_dog', region:'bree', type:'encounter', weight:8, title:'流浪狗',
    text:'一条瘦狗跟了你两条街。你停下，它也停下；你走，它也走。它的一条后腿是瘸的。',
    options:[
      { label:'给它点吃的', check:{attr:'spirit',dc:10},
        ok:{ text:'它吃完，舔了舔你的手，然后跟了你一路。夜里它叫了两次，第二次你醒了，看见有人在翻你的包。', fx:{renown:1,supply:-1,flag:{dog:true}} },
        no:{ text:'它吃完就跑了。', fx:{supply:-1} } },
      { label:'赶它走', fx:{}, ok:{ text:'你跺了跺脚。它退了两步，还是跟着。' } }
    ] },

  { id:'bree_market', region:'bree', type:'camp', weight:9, title:'集市',
    text:'集市正热闹。卖布的、卖陶的、卖药的，吆喝声一层压一层。空气里全是香料和汗的味道。',
    options:[
      { label:'逛一圈，补充东西', fx:{supply:2,hp:1}, ok:{ text:'你买了一些干粮，还尝了摊上的热饼。' } },
      { label:'找卖药的人聊聊', check:{attr:'lore',dc:12},
        ok:{ text:'他教了你几种止血的草，还送了你一小包。', fx:{item:'weed',renown:1} },
        no:{ text:'他说的你大半听不懂，最后只买了一小瓶没用的东西。', fx:{supply:-1} } }
    ] },

  { id:'bree_smoke', region:'bree', type:'story', weight:8, title:'屋顶的烟',
    text:'从高处看，布理的屋顶一片连着一片。大部分烟囱都冒烟，只有一处没有——那家的屋顶是新的。',
    options:[
      { label:'过去看看', check:{attr:'cunning',dc:13},
        ok:{ text:'门锁着，窗户从里面钉死了。你在后院找到一堆烧过的东西，还有半张没烧完的信。', fx:{renown:2,flag:{letter:true}} },
        no:{ text:'你绕着房子走了两圈，什么也没看出来。有个人在对面窗子里看你。', fx:{resolve:-1} } },
      { label:'不关我的事', fx:{}, ok:{ text:'你收回目光，继续走。' } }
    ] },

  { id:'bree_well', region:'bree', type:'treasure', weight:8, title:'广场的井',

  { id:'wild_rain', region:'wild', type:'camp', weight:9, title:'冷雨',

  { id:'wild_bridge', region:'wild', type:'encounter', weight:9, title:'独木桥',

  { id:'wild_marker', region:'wild', type:'story', weight:8, title:'路标',

  { id:'wild_end', region:'wild', type:'story', weight:8, title:'最后一段',

  { id:'shire_mill_after', region:'shire', type:'story', weight:0, title:'磨坊的火',

  { id:'bree_strider', region:'bree', type:'story', weight:0, title:'他说的那条路',

  { id:'wild_dead', region:'wild', type:'encounter', weight:0, title:'从土里出来的',

  /* ==================== 阴影与誓言 ==================== */
  { id:'any_cleanse_water', region:'any', type:'camp', weight:14, require:{ minShadow:2 },

/* 抽中事件后按当前阴影取版本：有整篇替换就用替换，否则看有没有注脚 */
function shadowVariant(ev){
  if(!(G && G.shadow >= SHADOW_TEXT_AT)) return ev;
  if(SHADOW_TEXTS[ev.id]) return Object.assign({}, ev, { text: SHADOW_TEXTS[ev.id] });
  if(SHADOW_TAIL[ev.id]) return Object.assign({}, ev, { text: ev.text + '\n\n' + SHADOW_TAIL[ev.id] });
  return ev;
}

const META_KEY = 'me_meta_v2';
const SAVE_KEY = 'me_run_v2';

function defaultMeta(){
  return { renown:0, materials:0, maxTier:1, talents:[], armory:{}, loadout:{}, runs:0, wins:0, best:0, seen:{}, origins:['ranger','warden','lore'] };
}
function loadMeta(){
  try{
    const raw = localStorage.getItem(META_KEY);
    if(!raw) return defaultMeta();
    const m = JSON.parse(raw);
    const d = defaultMeta();
    return Object.assign(d, m);
  }catch(e){ return defaultMeta(); }
}
function saveMeta(m){
  try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(e){}
}
let META = loadMeta();

function checkUnlocks(){
  if(!META.origins || !META.origins.length) META.origins = ['ranger','warden','lore'];
  const added = [];
  for(const h of HEROES){
    if(META.origins.indexOf(h.id) >= 0) continue;
    const u = h.unlock;
    if(!u){ META.origins.push(h.id); added.push(h); continue; }
    if((u.renown && META.renown >= u.renown) || (u.wins && META.wins >= u.wins)){
      META.origins.push(h.id); added.push(h);
    }
  }
  if(added.length) saveMeta(META);
  return added;
}

/* ---------- 6. 地图 ---------- */
const NODE_TYPES = {
  start:    { label:'起', color:'#8a6a3a', fill:'#f0e3c8' },
  final:    { label:'终', color:'#5a4632', fill:'#e6d7b8' },
  encounter:{ label:'险', color:'#8a3a2a', fill:'#f7e4de' },
  story:    { label:'闻', color:'#3d5a7a', fill:'#e4ecf4' },
  camp:     { label:'营', color:'#4d6b3a', fill:'#e6eedd' },
  treasure: { label:'藏', color:'#96682c', fill:'#f6ecd6' }
};

function layerRegion(layer){
  const i = Math.min(ROUTE.length-1, Math.floor(layer / LAYERS_PER_REGION));
  return ROUTE[i];
}

function genMap(seed){
  const rnd = mulberry32(hashStr(seed + '|route'));
  const L = TOTAL_LAYERS, CX = 360;
  const layers = [];

  for(let i=0;i<L;i++){
    let count = (i===0 || i===L-1) ? 1 : (2 + (rnd() < 0.4 ? 1 : 0));
    const nodes = [];
    for(let j=0;j<count;j++){
      let x = CX;
      if(count===2) x = CX + (j===0 ? -112 : 112);
      else if(count===3) x = CX + (j-1)*238;
      x += (rnd()-0.5) * (count===1 ? 30 : 40);
      nodes.push({ id:'n'+i+'_'+j, layer:i, region:layerRegion(i), x:Math.round(x), y:60+i*48, type:'story', next:[] });
    }
    layers.push(nodes);
  }

  /* 类型分配：每区至少 1 个营地，起终固定 */
  const byRegion = {};
  for(let i=1;i<L-1;i++){
    for(const n of layers[i]){
      const r = rnd();
      if(r < 0.36) n.type = 'encounter';
      else if(r < 0.68) n.type = 'story';
      else if(r < 0.85) n.type = 'camp';
      else n.type = 'treasure';
      const key = n.region;
      (byRegion[key] = byRegion[key] || []).push(n);
    }
  }
  for(const rid of ROUTE){
    const arr = byRegion[rid] || [];
    if(arr.length && !arr.some(n=>n.type==='camp')){
      arr[ri(rnd, arr.length)].type = 'camp';
    }
  }
  layers[0][0].type = 'start';
  layers[L-1][0].type = 'final';

  /* 连线：区间单调 + 跨度约束 */
  for(let i=0;i<L-1;i++){
    const cur = layers[i], nxt = layers[i+1];
    const m = cur.length, n = nxt.length;
    cur.forEach((a, j)=>{
      const lo = Math.floor(j*n/m);
      const hi = Math.min(n-1, Math.floor((j+1)*n/m));
      const cands = [];
      for(let t=lo;t<=hi;t++) cands.push(t);
      let viable = cands.filter(t=>Math.abs(nxt[t].x - a.x) <= 250);
      if(!viable.length) viable = cands;
      viable.sort((p,q)=>Math.abs(nxt[q].x-a.x)-Math.abs(nxt[p].x-a.x));
      const k = (viable.length>1 && rnd()<0.5) ? 2 : 1;
      for(let t=0;t<Math.min(k,viable.length);t++){
        const id = nxt[viable[t]].id;
        if(!a.next.includes(id)) a.next.push(id);
      }
    });
    nxt.forEach((b, t)=>{
      if(cur.some(a=>a.next.includes(b.id))) return;
      let best = null;
      for(let j=0;j<m;j++){
        const lo = Math.floor(j*n/m);
        const hi = Math.min(n-1, Math.floor((j+1)*n/m));
        if(t>=lo && t<=hi){ best = cur[j]; break; }
      }
      if(!best) best = cur.slice().sort((p,q)=>Math.abs(p.x-b.x)-Math.abs(q.x-b.x))[0];
      best.next.push(b.id);
    });
  }

  const index = {};
  layers.forEach(ls=>ls.forEach(n=>index[n.id]=n));
  return { layers, index };
}

function validateMap(map){
  const errors = [];
  const L = map.layers.length;
  for(let i=0;i<L-1;i++) for(const n of map.layers[i]) if(!n.next.length) errors.push('dead-end '+n.id);
  for(let i=1;i<L;i++) for(const n of map.layers[i]) if(!map.layers[i-1].some(a=>a.next.includes(n.id))) errors.push('orphan '+n.id);
  const seen = new Set(); const stack=[map.layers[0][0].id];
  while(stack.length){ const id=stack.pop(); if(seen.has(id)) continue; seen.add(id); for(const nx of map.index[id].next) stack.push(nx); }
  if(!seen.has(map.layers[L-1][0].id)) errors.push('unreachable final');
  return errors;
}

/* ---------- 7. 状态 ---------- */
let G = null;

function talentFx(){
  const out = { hpMax:0, supplyMax:0, resolveMax:0, valor:0, cunning:0, lore:0, spirit:0, extraResolve:0, rules:{} };
  for(const id of META.talents){
    const t = TALENTS.find(x=>x.id===id);
    if(!t) continue;
    if(t.fx) for(const k in t.fx) out[k] = (out[k]||0) + t.fx[k];
    if(t.extra) for(const k in t.extra) out[k] = (out[k]||0) + t.extra[k];
    if(t.rule) out.rules[t.rule] = true;
  }
  return out;
}

function equippedFx(loadout){
  const out = { hpMax:0, supplyMax:0, resolveMax:0, valor:0, cunning:0, lore:0, spirit:0 };
  const lo = loadout || (G && G.equipped) || {};
  for(const slot of SLOT_ORDER){
    const id = lo[slot];
    if(!id || !ITEMS[id]) continue;
    const it = ITEMS[id];
    const plus = (META.armory[id] || 0);
    for(const k in it.fx){
      if(k==='hpMax' || k==='supplyMax' || k==='resolveMax') out[k] += it.fx[k];
      else if(ATTRS[k]) out[k] += it.fx[k];
    }
    /* 强化：每级给主属性 +1（取 fx 第一项） */
    if(plus > 0){
      const keys = Object.keys(it.fx).filter(k=>ATTRS[k]);
      if(keys.length) out[keys[0]] += plus;
      else out.hpMax += plus;
    }
  }
  return out;
}

function newGame(heroId, tierId, seed){
  const hero = HEROES.find(h=>h.id===heroId);
  const tier = TIERS.find(t=>t.id===tierId) || TIERS[0];

  const ef = equippedFx(META.loadout || {});
  const mods = tier.mods || {};

  const hpMax = hero.hp + tf.hpMax + ef.hpMax;
  const supplyMax = Math.max(3, hero.supply + tf.supplyMax + ef.supplyMax + (mods.supply||0));
  const resolveMax = hero.resolve + tf.resolveMax + ef.resolveMax + tf.extraResolve;

  G = {
    v:2, seed, tierId:tier.id, hero:JSON.parse(JSON.stringify(hero)),
    hp:hpMax, hpMax,
    supply:supplyMax, supplyMax,
    resolve:resolveMax, resolveMax,
    attrs:{
      valor: hero.attrs.valor + tf.valor + ef.valor,
      cunning: hero.attrs.cunning + tf.cunning + ef.cunning,
      lore: hero.attrs.lore + tf.lore + ef.lore,
      spirit: hero.attrs.spirit + tf.spirit + ef.spirit
    },
    items:[], loot:[], flags:{}, seen:{}, chain:null,
    shadow:0, vow:null, vowLayer:0, costsTaken:[], tokens:[], groupCount:{},
    map, at:map.layers[0][0].id, layer:0,
    screen:'map', event:null, pending:null, log:[],
    walkedList:[], rerolls:0, perLayerLore:false, wardenUsed:false,
    standUsed:false, luckUsed:false, firstCheck:true,
    renown:0, materials:0, over:null,
    campHalf: !!mods.campHalf, dcBonus: mods.dc||0, supplyDrain: mods.supplyDrain||0, dmgBonus: mods.dmg||0,
    hunt: !!mods.hunt, noRetreat: !!mods.noRetreat, finalDC: mods.finalDC||0,
    rules: tf.rules,
    equipped: Object.assign({}, META.loadout || {})
  };

  /* 出身自带 */
  if(hero.start){
    (hero.start.tokens||[]).forEach(t=>{
      const tk = TOKENS[t];
      if(tk) G.tokens.push({ id:t, name:tk.name, note:tk.note });
    });
    (hero.start.items||[]).forEach(it=>{
      if(ITEMS[it]) G.loot.push({ id:it, plus:0 });
    });
  }
  recalc();
  G.hp = G.hpMax;
  G.supply = G.supplyMax;
  G.resolve = G.resolveMax;

  addLog('启程 · ' + REGIONS[ROUTE[0]].name + (tier.id>1 ? ' · ' + tier.name : ''));
  G.screen = 'event';
  G.event = { id:'__start', kicker:'启程', title:'启程', text:startText(), options:[{ label:'出发', free:true }] };
  saveRun();
  render();
}

function G_equippedSnapshot(){
  return (META && META.loadout) ? META.loadout : {};

function clamp(){
  G.hp = Math.max(0, Math.min(G.hp, G.hpMax));
  G.supply = Math.max(0, Math.min(G.supply, G.supplyMax));
  G.resolve = Math.max(0, Math.min(G.resolve, G.resolveMax));
}

function addLog(s){ G.log.unshift(s); if(G.log.length>50) G.log.pop(); }

function applyFx(fx, ctx){
  if(!fx) return [];
  let f = fx;
  /* 难度 IV：营地与休整的恢复减半 */
  if(f.hp && f.hp < 0 && G.dmgBonus) f = Object.assign({}, f, { hp: f.hp - G.dmgBonus });
  if(ctx && ctx.camp && G.campHalf){
    f = Object.assign({}, fx);
    if(f.hp > 0) f.hp = Math.ceil(f.hp / 2);
    if(f.supply > 0) f.supply = Math.ceil(f.supply / 2);
  }
  const out = [];
  if(f.hp){ G.hp += f.hp; out.push({k:'生命',v:f.hp}); }
  if(f.supply){ G.supply += f.supply; out.push({k:'补给',v:f.supply}); }
  if(f.resolve){ G.resolve += f.resolve; out.push({k:'决心',v:f.resolve}); }
  if(f.renown){ G.renown += f.renown; out.push({k:'声望',v:f.renown}); }
  if(f.material){ G.materials += f.material; out.push({k:'材料',v:f.material}); }
  if(f.shadow){ addShadow(f.shadow); out.push({k:'阴影',v:'+'+f.shadow}); }
  if(f.token){
    const list = Array.isArray(f.token) ? f.token : [f.token];
    list.forEach(tid=>{
      const tk = TOKENS[tid];
      if(tk && !G.tokens.some(t=>t.id===tid)){
        G.tokens.push({ id:tid, name:tk.name, note:tk.note });
        out.push({ k:'记下', v:tk.name });
      }
    });
  }
  if(f.item){
    const it = ITEMS[f.item];
    if(G.vow && G.vow.type === 'noLoot' && it && it.slot !== 'consume'){
      G.renown += 4;
      out.push({ k:'守誓', v:'声望 +4' });
    } else if(it && it.slot === 'consume'){
      G.hp += (it.fx.hp||0); G.supply += (it.fx.supply||0);
      out.push({ k:'用掉', v:it.name });
    } else if(it){
      G.loot.push({ id:f.item, plus:0 });
      out.push({ k:'拾得', v:it.name });
    }
  }
  if(f.flag){ for(const k in f.flag) G.flags[k] = f.flag[k]; }
  clamp();
  return out;
}

/* ---------- 多解：条件与凭证 ---------- */
function hasNeed(need){
  if(!need) return true;
  if(need.token && !(G.tokens||[]).some(t=>t.id===need.token)) return false;
  if(need.flag && !G.flags[need.flag]) return false;
  if(need.shadowMin != null && (G.shadow||0) < need.shadowMin) return false;
  if(need.vow && !(G.vow && G.vow.type===need.vow)) return false;
  return true;
}
function needLabel(need){
  if(!need) return '';
  if(need.token){
    const tk = TOKENS[need.token];
    return '缺少：' + (tk ? tk.name : need.token);
  }
  if(need.flag) return '缺少：前提';
  if(need.shadowMin != null) return '需要更深的阴影';
  if(need.vow) return '需要立誓';
  return '条件不足';
}
function needHave(need){
  if(!need || !need.token) return '';
  const tk = TOKENS[need.token];
  return '持有：' + (tk ? tk.name : need.token);
}
function applyReframe(id){
  const ev = EVENTS.find(e=>e.id===id);
  if(!ev) return false;
  G.seen[ev.id] = true;
  injectShadowOptions(ev);
  G.event = ev;
  G.screen = 'event';
  render();
  return true;
}

/* ---------- 阴影 ---------- */
function shadowStage(){
  const s = G ? (G.shadow || 0) : 0;
  let cur = SHADOW_STAGES[0];
  for(const st of SHADOW_STAGES) if(s >= st.at) cur = st;
  return cur;
}

function addShadow(n){
  if(!G || !n) return;
  const before = shadowStage().name;
  G.shadow = Math.max(0, Math.min(SHADOW_MAX, (G.shadow || 0) + n));
  const after = shadowStage();
  if(after.name !== before) addLog('阴影 · ' + after.name + '：' + after.line);
}

/* 阴影 ≥4 时，遭遇事件里会长出一个不必检定的选项 */
function injectShadowOptions(ev){
  if(!G || G.shadow < 2) return ev;
  if(ev.type !== 'encounter') return ev;
  if(!ev.options || ev.options.some(o=>o.shadowOpt)) return ev;
  if(String(ev.id).indexOf('__') === 0) return ev;
  const idx = Math.min(SHADOW_OPTS.length - 1, Math.floor((G.shadow - 2) / 2));
  const so = SHADOW_OPTS[idx];
  ev.options = ev.options.concat([{
    label: so.label,
    shadowOpt: true,
    ok: { text: so.text, fx: { shadow:3, renown:2 } }
  }]);
  return ev;
}

/* 代价成功：抽一条代价 */
function applyCost(){
  if(!G) return null;
  const rnd = mulberry32(hashStr(G.seed + '|cost|' + G.at + '|' + G.layer));
  const pool = ['hp','hp','supply'];
  if((G.shadow||0) >= 2) pool.push('shadow');
  if(G.loot.length) pool.push('loot','loot');
  else if(SLOT_ORDER.some(s=>G.equipped[s])) pool.push('gear');
  const key = pool[Math.floor(rnd()*pool.length)];
  const out = { id:key, text:'', fx:[] };

  if(key === 'loot' && G.loot.length){
    const i = Math.floor(rnd() * G.loot.length);
    const gone = G.loot.splice(i,1)[0];
    const it = ITEMS[gone.id];
    out.text = '你确实做到了。但' + (it ? it.name : '那件东西') + '不在你手里了。';
    out.fx.push({ k:'丢失', v: it ? it.name : gone.id });
  } else if(key === 'gear'){
    const slots = SLOT_ORDER.filter(s=>G.equipped[s]);
    if(!slots.length) return null;
    const slot = slots[Math.floor(rnd() * slots.length)];
    const id = G.equipped[slot];
    const it = ITEMS[id];
    const plus = META.armory[id] || 0;
    if(plus > 0){
      META.armory[id] = plus - 1;
      out.text = (it ? it.name : '手里的东西') + '裂了一道口子。还能用，但不如从前。';
      out.fx.push({ k:'受损', v:(it?it.name:id) + ' +' + plus + '→+' + (plus-1) });
    } else {
      delete META.armory[id];
      delete G.equipped[slot];
      out.text = (it ? it.name : '手里的东西') + '断了。你把它留在了原地。';
      out.fx.push({ k:'毁坏', v: it ? it.name : id });
    }
    recalc(); saveMeta(META);
  } else if(key === 'shadow'){
    addShadow(1);
    out.text = '你确实做到了。方式让你事后想了很久。';
    out.fx.push({ k:'阴影', v:'+1' });
  } else if(key === 'hp'){
    const dmg = 2 + (G.dmgBonus || 0);
    G.hp -= dmg;
    out.text = '你确实做到了。代价是身上多了一道口子。';
    out.fx.push({ k:'生命', v:-dmg });
  } else {
    G.supply -= 2;
    out.text = '你确实做到了。回过神时，背包轻了一截。';
    out.fx.push({ k:'补给', v:-2 });
  }
  clamp();
  if(G.costsTaken) G.costsTaken.push(key);
  return out;
}

/* ---------- 8. 事件选取 ---------- */
function pickEvent(node){
  const region = node.region;
  const cat = node.type;

  /* 事件链优先 */
  if(G.chain){
    const chained = EVENTS.find(e=>e.id===G.chain && !G.seen[e.id]);
    if(chained){
      const cr = chained.region;
      const curIdx = ROUTE.indexOf(region);
      const wantIdx = ROUTE.indexOf(cr);
      if(cr === 'any' || cr === region){
        G.chain = null;
        return chained;
      }
      /* 地区不对：保留这条线，等走到对应地区再兑现；已经走过就作废 */
      if(wantIdx >= 0 && curIdx > wantIdx) G.chain = null;
    } else {
      G.chain = null;
    }
  }

  /* 安静的节点：营地与叙事节点有一定概率先给一条独白。
     用 seed + 节点 id 派生随机数，保证同种子完全可复现。 */
  if(cat === 'camp' || cat === 'story'){
    const solUsed = (G.groupCount && G.groupCount.solitude) || 0;
    if(solUsed < 2){
      const srnd = mulberry32(hashStr(G.seed + '|' + node.id + '|sol'));
      if(srnd() < 0.35){
        const sols = EVENTS.filter(e=>{
          if(e.group !== 'solitude') return false;
          if(G.seen[e.id] || (e.weight||0) <= 0) return false;
          if(e.region !== 'any' && e.region !== region) return false;
          const q = e.require;
          if(!q) return true;
          if(q.minShadow != null && (G.shadow||0) < q.minShadow) return false;
          if(q.maxShadow != null && (G.shadow||0) > q.maxShadow) return false;
          if(q.vow && !(G.vow && G.vow.type === q.vow)) return false;
          if(q.noVow && G.vow) return false;
          if(q.flag && !G.flags[q.flag]) return false;
          if(q.notFlag && G.flags[q.notFlag]) return false;
          return true;
        });
        if(sols.length){
          const st = sols.reduce((s,e)=>s+(e.weight||10),0);
          let r2 = srnd()*st;
          for(const e of sols){ r2 -= (e.weight||10); if(r2<=0) return e; }
          return sols[sols.length-1];
        }
      }
    }
  }

  const match = e=>{
    if(G.seen[e.id]) return false;
    if((e.weight || 0) <= 0) return false;
    if(e.region!=='any' && e.region!==region) return false;
    /* 同类事件每局配额：避免一局里反复遇到同一种节奏 */
    if(e.group){
      const used = (G.groupCount && G.groupCount[e.group]) || 0;
      if(used >= (e.groupMax || 1)) return false;
    }
    if(e.require){
      if(e.require.minShadow != null && (G.shadow||0) < e.require.minShadow) return false;
      if(e.require.maxShadow != null && (G.shadow||0) > e.require.maxShadow) return false;
      if(e.require.vow && !(G.vow && G.vow.type === e.require.vow)) return false;
      if(e.require.noVow && G.vow) return false;
      if(e.require.flag && !G.flags[e.require.flag]) return false;
      if(e.require.notFlag && G.flags[e.require.notFlag]) return false;
    }
    if(cat==='treasure') return e.type==='treasure';
    return e.type === cat;
  };
  let pool = EVENTS.filter(match);
  /* 秘藏节点：先只在秘藏池里抽，抽空了再退到叙事池 */
  if(cat==='treasure' && !pool.length){
    pool = EVENTS.filter(e=>(e.region==='any'||e.region===region) && (e.weight||0)>0 && e.type==='story' && !G.seen[e.id]);
  }
  if(!pool.length){
    pool = EVENTS.filter(e=>(e.region==='any'||e.region===region) && (e.weight||0)>0 && e.type===(cat==='treasure'?'story':cat));
  }
  if(!pool.length) pool = EVENTS.filter(e=>e.region==='any' && (e.weight||0)>0);

  const rnd = mulberry32(hashStr(G.seed+'|'+node.id+'|e'));
  const total = pool.reduce((s,e)=>s+(e.weight||10),0);
  let r = rnd()*total;
  for(const e of pool){ r -= (e.weight||10); if(r<=0) return e; }
  return pool[pool.length-1];
}

/* ---------- 9. 检定 ---------- */
function rollD20(rnd){ return 1 + Math.floor(rnd()*20); }

function effDC(base){
  return base + (G ? G.dcBonus : 0);
}

/* ---------- 10. 重算（战利品即时生效，但死了就没了） ---------- */
function recalc(){
  if(!G) return;
  const tf = talentFx();
  const eq = equippedFx();
  const lb = { hpMax:0,supplyMax:0,resolveMax:0,valor:0,cunning:0,lore:0,spirit:0 };
  for(const l of (G.loot||[])){
    const it = ITEMS[l.id];
    if(!it || it.slot === 'consume') continue;
    for(const k in it.fx){
      if(k==='hpMax'||k==='supplyMax'||k==='resolveMax') lb[k] += it.fx[k];
      else if(ATTRS[k]) lb[k] += it.fx[k];
    }
  }
  const h = G.hero.attrs;
  const o = { valor:0, cunning:0, lore:0, spirit:0 };
  if(G.hero.rule === 'lorePlus') o.lore = 1;
  if(G.hero.rule === 'hobbit') o.cunning = 2;
  G.attrs = {
    valor:   h.valor   + tf.valor   + eq.valor   + lb.valor   + o.valor,
    cunning: h.cunning + tf.cunning + eq.cunning + lb.cunning + o.cunning,
    lore:    h.lore    + tf.lore    + eq.lore    + lb.lore    + o.lore,
    spirit:  h.spirit  + tf.spirit  + eq.spirit  + lb.spirit
  };
  const tier = TIERS.find(t=>t.id===G.tierId) || TIERS[0];
  G.hpMax = G.hero.hp + tf.hpMax + eq.hpMax + lb.hpMax;
  G.supplyMax = Math.max(3, G.hero.supply + tf.supplyMax + eq.supplyMax + lb.supplyMax + (tier.mods.supply||0) + (G.hero.rule === 'rider' ? -1 : 0));
  G.resolveMax = G.hero.resolve + tf.resolveMax + eq.resolveMax + lb.resolveMax + (G.hero.rule === 'hobbit' ? 1 : 0);
  clamp();
}

/* 按品质抽一件装备：普通常见，传世稀有。消耗品不参与 */
function rollLootItem(rnd){
  const pool = Object.keys(ITEMS).filter(k => ITEMS[k].slot !== 'consume');
  const w = { 0:5, 1:3, 2:1.5, 3:0.6 };
  const total = pool.reduce((s,k) => s + (w[ITEMS[k].q] || 1), 0);
  let r = rnd() * total;
  for(const k of pool){
    r -= (w[ITEMS[k].q] || 1);
    if(r <= 0) return k;
  }
  return pool[pool.length - 1];
}

function ioMsg(t, bad){
  const el = document.getElementById('ioMsg');
  if(!el) return;
  el.textContent = t;
  el.className = 'iomsg' + (bad ? ' bad' : '');
